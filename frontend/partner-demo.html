<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌟 成长星球 · 选我的科学伙伴</title>
<style>
  :root{
    --pink:#FF9EC9; --mint:#7FE3C0; --yellow:#FFD86B; --blue:#8FC7FF;
    --lav:#C4A7FF; --peach:#FFB38A; --bg1:#FFF3FB; --bg2:#EAF6FF; --bg3:#FFF7E8;
    --ink:#4A4466; --ink2:#8A84A8; --card:#fff; --shadow:0 14px 34px rgba(170,140,200,.22);
    --rare:#7FE3C0; --epic:#FFB38A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 600px at 10% -5%, rgba(255,158,201,.20), transparent 60%),
      radial-gradient(800px 600px at 100% 0%, rgba(143,199,255,.22), transparent 55%),
      radial-gradient(800px 800px at 50% 120%, rgba(127,227,192,.18), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    background-attachment:fixed;min-height:100vh;padding:24px 16px 60px;
  }
  .wrap{max-width:880px;margin:0 auto;}
  header{text-align:center;margin-bottom:18px;}
  header h1{font-size:26px;margin:0 0 4px;letter-spacing:1px;}
  header .sub{color:var(--ink2);font-size:13px;}
  .hero{display:flex;justify-content:center;margin:6px 0 18px;}
  .hero svg{width:120px;height:120px;animation:floaty 4s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
  .panel{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
  .step-h{font-size:17px;font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .step-h .n{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--lav),var(--blue));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
  /* 班级码 */
  .code-row{display:flex;gap:10px;flex-wrap:wrap;}
  .code-row input{flex:1;min-width:160px;border:2px solid #EFE6F5;border-radius:16px;padding:13px 16px;font-size:16px;font-family:inherit;outline:none;transition:.2s;}
  .code-row input:focus{border-color:var(--lav);box-shadow:0 0 0 4px rgba(196,167,255,.18);}
  button{font-family:inherit;font-weight:700;border:none;border-radius:16px;padding:13px 22px;font-size:15px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--lav),var(--blue));box-shadow:var(--shadow);transition:transform .15s,filter .15s;}
  button:hover{transform:translateY(-2px);filter:brightness(1.05);}
  button:active{transform:translateY(0);}
  button.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(170,140,200,.18);}
  button.big{width:100%;font-size:17px;padding:16px;margin-top:6px;}
  /* 学生选择 */
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{padding:10px 16px;border-radius:999px;background:#F4EEFB;color:var(--ink);font-weight:700;cursor:pointer;border:2px solid transparent;transition:.15s;}
  .chip:hover{background:#ECE2F8;}
  .chip.sel{background:linear-gradient(135deg,var(--lav),var(--blue));color:#fff;border-color:#fff;box-shadow:0 6px 16px rgba(143,199,255,.5);}
  .chip .done{font-size:12px;opacity:.8;margin-left:4px;}
  /* 图鉴 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .pack-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px;}
  .pack-tabs button{flex:1;min-width:92px;padding:9px 12px;border-radius:999px;border:2px solid #E6DBF5;background:#fff;color:#6B6280;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;}
  .pack-tabs button.sel{background:linear-gradient(135deg,var(--lav),var(--blue));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(143,199,255,.4);}
  .pack-tabs button:hover:not(.sel){background:#F8F3FC;}
  .pcard{background:#fff;border:3px solid transparent;border-radius:22px;padding:16px 12px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden;}
  .pcard:hover{transform:translateY(-5px);}
  .pcard .emoji{font-size:50px;line-height:1.1;display:inline-block;animation:breathe 3.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
  .pcard .nm{font-size:15px;margin-top:8px;font-weight:800;}
  .pcard .tag{display:inline-block;font-size:11px;margin-top:6px;padding:2px 10px;border-radius:20px;font-weight:700;}
  .pcard .tag.common{background:#F0ECFA;color:#7A7196;}
  .pcard .tag.rare{background:rgba(127,227,192,.25);color:#2f8f6f;}
  .pcard .tag.epic{background:rgba(255,179,138,.28);color:#b9652c;}
  .pcard.sel{border-color:var(--lav);box-shadow:0 12px 30px rgba(196,167,255,.55);transform:translateY(-5px);}
  .pcard.sel::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--lav),var(--blue));color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .pcard.sel .emoji{animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(.6);}60%{transform:scale(1.3);}100%{transform:scale(1.12);}}
  /* 昵称 + 颜色 */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:700;}
  .field input{border:2px solid #EFE6F5;border-radius:14px;padding:12px 14px;font-size:15px;font-family:inherit;width:100%;outline:none;}
  .field input:focus{border-color:var(--lav);}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;}
  .sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s;}
  .sw.sel{transform:scale(1.18);box-shadow:0 0 0 3px var(--ink);}
  /* 预览 */
  .preview{text-align:center;padding:8px 0 4px;}
  .preview .big{font-size:84px;display:inline-block;animation:floaty 3.5s ease-in-out infinite;}
  .preview .nm{font-size:22px;font-weight:800;margin-top:4px;}
  /* 提示 */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .err{color:#d8506a;font-size:13px;margin-top:8px;}
  .muted{color:var(--ink2);font-size:12px;line-height:1.7;}
  .hidden{display:none!important;}
  /* 成功彩屑 */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
  .confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2;}}
  .success{text-align:center;padding:14px 0;}
  .success .big{font-size:90px;animation:pop .6s ease;}
  /* 真实伙伴生物（与老师大屏同款 SVG） */
  .ava{width:56px;height:56px;margin:0 auto;display:block;}
  .ava-big{width:120px;height:120px;margin:6px auto;display:block;animation:floaty 3.5s ease-in-out infinite;}
  .crt{width:100%;height:100%;display:block;overflow:visible;animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 82%;}
  @keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.02)}}
  .c-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  .c-wig{transform-box:fill-box;transform-origin:center;animation:wig 3.2s ease-in-out infinite;}
  @keyframes wig{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
  .pcard:hover .crt{animation-duration:1.1s;transform:scale(1.08);}
  .pcard.sel .crt{filter:drop-shadow(0 0 6px rgba(196,167,255,.7));}
  .crt.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1);}
  @keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(1.12)}60%{transform:translateY(0) scale(.96)}100%{transform:translateY(0) scale(1)}}

  /* R43: 伙伴点击互动 — 部位反馈 */
  .ava-home{position:relative;}
  .ava-home svg{cursor:pointer;touch-action:manipulation;}
  .ava-home .hot-zone{fill:transparent;stroke:none;cursor:pointer;}
  .ava-home .hot-zone:hover{fill:rgba(255,255,255,.08);}
  /* 部位动画 */
  @keyframes pet-nod{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
  @keyframes pet-belly{0%,100%{transform:scale(1)}25%{transform:scale(1.15,scaleY(.92))}50%{transform:scale(.9,1.1)}75%{transform:scale(1.08)}}
  @keyframes pet-dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-8deg)}50%{transform:translateY(-2px) rotate(6deg)}75%{transform:translateY(-4px) rotate(-4deg)}}
  @keyframes pet-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .crt.pet-nod{animation:pet-nod .6s ease-in-out;}
  .crt.pet-belly{animation:pet-belly .55s ease-in-out;transform-origin:50% 65%;}
  .crt.pet-dance{animation:pet-dance .7s ease-in-out;transform-origin:50% 80%;}
  .crt.pet-spin{animation:pet-spin .6s ease-in-out;transform-origin:50% 50%;}
  /* 对话气泡 */
  .pet-bubble{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:6px 14px;font-size:14px;font-weight:800;color:#5A4E86;box-shadow:0 4px 14px rgba(120,90,160,.25);white-space:nowrap;pointer-events:none;animation:bub-in .3s ease-out;z-index:10;}
  .pet-bubble.out{animation:bub-out .3s ease-in forwards;}
  @keyframes bub-in{0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.7);}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}
  @keyframes bub-out{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}100%{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.8);}}
  /* 爱心/星星粒子 */
  .pet-fx{position:absolute;font-size:20px;pointer-events:none;animation:pet-float 1.1s ease-out forwards;z-index:10;}
  @keyframes pet-float{0%{opacity:1;transform:translateY(0) scale(.5);}100%{opacity:0;transform:translateY(-50px) scale(1.4);}}
  /* 我的伙伴主页 */
  .home{text-align:center;padding:6px 0;}
  .home-head{display:flex;align-items:center;gap:18px;justify-content:center;margin:6px 0 4px;}
  .ava-home{width:128px;height:128px;animation:floaty 3.6s ease-in-out infinite;}
  .home-name{font-size:24px;font-weight:900;margin-top:6px;}
  .home-sub{font-size:13px;color:#9a90bb;margin-top:2px;}
  .eco{max-width:420px;margin:14px auto 6px;}
  .eco-bar{height:16px;border-radius:10px;background:#EFE8FA;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,90,160,.18);}
  .eco-bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--lav),var(--blue));transition:width .6s cubic-bezier(.3,1.2,.5,1);}
  .eco-txt{font-size:13px;color:#6f6691;margin-top:6px;}
  .eco-txt b{color:#5A4E86;font-size:15px;}
  .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 8px;}
  .acts button{font-size:15px;padding:12px 16px;border-radius:16px;border:none;cursor:pointer;background:linear-gradient(135deg,#C4A7FF,#8FC7FF);color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(143,199,255,.45);transition:transform .12s;}
  .acts button:hover{transform:translateY(-2px);}
  .acts button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;background:#ddd;}
  .act-msg{min-height:20px;font-size:14px;font-weight:700;color:#2f8f6f;margin:4px 0;}
  .log{text-align:left;max-width:440px;margin:8px auto 4px;display:flex;flex-direction:column;gap:7px;}
  .log .row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 13px;box-shadow:var(--shadow);font-size:13px;}
  .log .row .ic{font-size:20px;}
  .log .row .tx{flex:1;color:#4a4466;}
  .log .row .pt{font-weight:900;color:#5A4E86;}
  .log .empty{color:#a99ec8;text-align:center;font-size:13px;padding:8px;}
  .hop-fx{animation:hop .6s cubic-bezier(.3,1.6,.5,1);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 成长星球</h1>
    <div class="sub">选一个属于你的科学伙伴，它会住进班级的星球里～</div>
  </header>

  <div class="hero">
    <!-- 核心原创 SVG 吉祥物：星球上的小生命 -->
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <radialGradient id="pg" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#C4A7FF"/><stop offset="100%" stop-color="#8FC7FF"/>
        </radialGradient>
      </defs>
      <circle cx="60" cy="64" r="40" fill="url(#pg)"/>
      <ellipse cx="60" cy="64" rx="58" ry="14" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>
      <circle cx="44" cy="58" r="7" fill="#fff" opacity=".85"/>
      <circle cx="74" cy="70" r="5" fill="#fff" opacity=".7"/>
      <circle cx="64" cy="50" r="4" fill="#fff" opacity=".6"/>
      <g>
        <circle cx="60" cy="52" r="13" fill="#FFE9A8"/>
        <circle cx="55" cy="50" r="2.4" fill="#4A4466"/>
        <circle cx="65" cy="50" r="2.4" fill="#4A4466"/>
        <path d="M55 56 Q60 60 65 56" stroke="#4A4466" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- 步骤1：班级码 -->
  <div class="panel" id="stepCode">
    <div class="step-h"><span class="n">1</span> 输入班级码</div>
    <div class="code-row">
      <input id="codeInput" placeholder="老师给的 6 位班级码" maxlength="8" autocapitalize="off" spellcheck="false">
      <button onclick="loadClass()">进入班级</button>
    </div>
    <div class="err" id="codeErr"></div>
    <p class="muted" style="margin-top:10px">没有班级码？问问你的科学老师～ 也可以直接在网址后面加 <b>?code=班级码</b> 直接打开。</p>
  </div>

  <!-- 步骤2：选自己 -->
  <div class="panel hidden" id="stepWho">
    <div class="step-h"><span class="n">2</span> 你是哪位同学？</div>
    <div class="chips" id="stuChips"></div>
  </div>

  <!-- 步骤3：选伙伴 -->
  <div class="panel hidden" id="stepPick">
    <div class="step-h"><span class="n">3</span> 选一个你的科学伙伴 <span class="muted" id="packName" style="font-weight:600"></span></div>
    <div class="pack-tabs" id="packTabs"></div>
    <div class="grid" id="lib"></div>
  </div>

  <!-- 步骤4：昵称 + 主色 -->
  <div class="panel hidden" id="stepInfo">
    <div class="step-h"><span class="n">4</span> 给它起个名字、选个颜色</div>
    <div class="preview">
      <div class="ava-big" id="pvEmoji"></div>
      <div class="nm" id="pvName">待认领</div>
    </div>
    <div class="field" style="margin-top:12px">
      <label>伙伴昵称</label>
      <input id="nick" placeholder="例如：闪闪 / 团团 / 小火苗" maxlength="20">
    </div>
    <div class="field">
      <label>主色（你的星球专属色）</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <button class="big" onclick="claim()">🎉 认领我的伙伴</button>
    <div class="err" id="claimErr"></div>
  </div>

  <!-- 成功 -->
  <div class="panel hidden success" id="stepDone">
    <div class="ava-big" id="doneEmoji"></div>
    <div style="font-size:20px;font-weight:800;margin-top:6px" id="doneTxt">认领成功！</div>
    <p class="muted" id="doneSub" style="margin-top:8px"></p>
    <button class="ghost" style="margin-top:12px" onclick="resetAll()">换一台设备 / 重新认领</button>
  </div>

  <!-- 我的伙伴主页 -->
  <div class="panel hidden home" id="stepHome">
    <div class="home-head">
      <div class="ava-home" id="homeAva"></div>
      <div style="text-align:left">
        <div class="home-name" id="homeName"></div>
        <div class="home-sub" id="homeSub"></div>
      </div>
    </div>
    <div class="eco">
      <div class="eco-bar"><i id="ecoFill"></i></div>
      <div class="eco-txt">生态值 <b id="ecoVal">0</b> · 今日获得 <b id="ecoToday">0</b></div>
    </div>
    <div class="acts">
      <button id="btnCheckin" onclick="doActivity('checkin')">🌞 每日签到</button>
      <button id="btnQuiz" onclick="startQuiz()">📚 课间答题</button>
      <button id="btnObserve" onclick="doActivity('observe')">🔍 观察记录</button>
      <button id="btnHomework" onclick="doActivity('homework')">📝 提交作业</button>
      <button id="btnSwitch" onclick="requestSwitch()" style="background:linear-gradient(135deg,#FFB38A,#FF9EC9);">🔄 换伙伴</button>
    </div>
    <div class="act-msg" id="actMsg"></div>
    <div class="log" id="actLog"></div>
    <button class="ghost" style="margin-top:14px" onclick="resetAll()">切换账号 / 重新认领</button>
  </div>
</div>

<!-- 隐私政策首次提示 -->
<div id="privacyBanner" class="panel" style="background:rgba(255,255,255,.85);border:2px solid #E6DBF5;font-size:13px;text-align:center;display:none;">
  <p style="margin:0 0 10px;color:#6f6691;">我们重视你的隐私，本工具只采集必要的课堂互动数据，不采集个人隐私信息。</p>
  <div style="display:flex;gap:10px;justify-content:center;">
    <button class="ghost" style="padding:8px 16px;font-size:13px;" onclick="window.open('privacy.html','_blank')">查看隐私政策</button>
    <button style="padding:8px 16px;font-size:13px;background:linear-gradient(135deg,#C4A7FF,#8FC7FF);" onclick="acceptPrivacy()">我知道了</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>

<script>
// ===== 伙伴图鉴（原创形象，无 IP 风险；kind 与后端 PARTNER_KINDS 一一对应）=====
const LIB = [
  // 萌系自然 1-2 年级
  {kind:"tuan_tuan",name:"团团熊",emoji:"🐻",pack:"cute_nature",rarity:"common"},
  {kind:"ya_ya",name:"芽芽",emoji:"🌱",pack:"cute_nature",rarity:"common"},
  {kind:"cloud_sheep",name:"云朵羊",emoji:"🐑",pack:"cute_nature",rarity:"common"},
  {kind:"star_kid",name:"星仔",emoji:"⭐",pack:"cute_nature",rarity:"rare"},
  {kind:"bunny",name:"跳跳兔",emoji:"🐰",pack:"cute_nature",rarity:"common"},
  {kind:"duckling",name:"黄小鸭",emoji:"🐤",pack:"cute_nature",rarity:"common"},
  {kind:"piggy",name:"粉粉猪",emoji:"🐷",pack:"cute_nature",rarity:"common"},
  {kind:"kitty",name:"喵喵猫",emoji:"🐱",pack:"cute_nature",rarity:"common"},
  {kind:"puppy",name:"旺财狗",emoji:"🐶",pack:"cute_nature",rarity:"common"},
  {kind:"hug_bear",name:"抱抱熊",emoji:"🧸",pack:"cute_nature",rarity:"rare"},
  {kind:"bub_fish",name:"泡泡鱼",emoji:"🐠",pack:"cute_nature",rarity:"common"},
  {kind:"slow_turtle",name:"慢慢龟",emoji:"🐢",pack:"cute_nature",rarity:"common"},
  {kind:"blue_whale",name:"蓝蓝鲸",emoji:"🐳",pack:"cute_nature",rarity:"epic"},
  {kind:"little_crab",name:"小螃蟹",emoji:"🦀",pack:"cute_nature",rarity:"rare"},
  // 生命观察 3-4 年级
  {kind:"can_bao",name:"蚕宝",emoji:"🐛",pack:"life_obs",rarity:"common"},
  {kind:"ke_dou",name:"蝌蚪",emoji:"🐸",pack:"life_obs",rarity:"common"},
  {kind:"seed_sprite",name:"种子精",emoji:"🌰",pack:"life_obs",rarity:"common"},
  {kind:"ant_worker",name:"蚁工",emoji:"🐜",pack:"life_obs",rarity:"common"},

let CLASS = null;          // {id,name,grade,theme_pack}
let STUDENTS = [];         // [{id,name,nickname,partner_kind,color}]
let me = null;             // 当前选中的学生
let selKind = null;        // 选中的伙伴 kind
let selColor = SWATCHES[0];
let currentPack = null;    // null 表示按年级推荐，'all' 表示全部
let deviceToken = null;    // R45: 设备令牌

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }

// URL 带 ?code= 直接进；若已认领则尝试直接进入主页
(function init(){
  const m=location.search.match(/[?&]code=([^&]+)/); if(m) $('codeInput').value=m[1].trim();
  // R36: 首次访问展示隐私提示
  if(!localStorage.getItem('gp_privacy_ok')){
    $('privacyBanner').style.display='block';
  }
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem('gp_me')||'null'); }catch(e){}
  const fresh=/[?&]fresh=1/.test(location.search); // 老师端"打开学生自选页"进入：强制重新认领
  if(saved && saved.classCode && saved.studentId && saved.deviceToken){
    if(fresh){
      // 老师端入口（首次认领新学生）：给二选一
      const redo=confirm('这台设备已认领过伙伴。\n\n「确定」= 换同学重新认领（回到入班页）\n「取消」= 继续上次的伙伴');
      if(redo){ $('codeInput').value=saved.classCode; }
      else{ deviceToken=saved.deviceToken; restoreHome(saved.classCode, saved.studentId); }
    }else{
      // 学生日常入口（课间答题/交作业）：直接进上次伙伴主页，不弹窗
      deviceToken=saved.deviceToken;
      restoreHome(saved.classCode, saved.studentId);
    }
  }
})();

function acceptPrivacy(){
  localStorage.setItem('gp_privacy_ok','1');
  $('privacyBanner').style.display='none';
}

async function restoreHome(code, studentId){
  try{
    const res=await fetch('/api/join/'+encodeURIComponent(code));
    if(!res.ok) return;
    const data=await res.json();
    CLASS=data.class; STUDENTS=data.students||[];
    const st=STUDENTS.find(s=>s.id===studentId);
    if(st && st.partner_kind && deviceToken){ me=st; await loadHome(); }
  }catch(e){}
}

async function loadClass(){
  const code=$('codeInput').value.trim().toLowerCase();
  $('codeErr').textContent='';
  if(!code){ $('codeErr').textContent='请输入班级码'; return; }
  try{
    const res=await fetch('/api/join/'+encodeURIComponent(code));
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||'班级码无效'); }
    const data=await res.json();
    CLASS=data.class; STUDENTS=data.students||[];
    if(!STUDENTS.length) throw new Error('这个班级还没有学生，请老师先在花名册导入');
    renderStudents();
    $('stepCode').classList.add('hidden');
    $('stepWho').classList.remove('hidden');
  }catch(err){ $('codeErr').textContent=err.message; }
}

function renderStudents(){
  const box=$('stuChips'); box.innerHTML='';
  STUDENTS.forEach(s=>{
    const c=document.createElement('div');
    c.className='chip';
    c.textContent=s.name;
    if(s.partner_kind){ const k=LIB.find(x=>x.kind===s.partner_kind); c.innerHTML=s.name+'<span class="done">已认领 '+(k?k.emoji:'')+'</span>'; }
    c.onclick=(e)=>pickStudent(s, e.currentTarget);
    box.appendChild(c);
  });
}

function pickStudent(s, el){
  document.querySelectorAll('#stuChips .chip').forEach(c=>c.classList.remove('sel'));
  if(el) el.classList.add('sel');
  me=s; selKind=null; selColor=s.color||SWATCHES[0];
  // 已认领过 → 直接进入「我的伙伴」主页
  if(s.partner_kind){
    loadHome();
    return;
  }
  renderLib();
  $('stepWho').classList.add('hidden');
  $('stepPick').classList.remove('hidden');
  $('stepPick').scrollIntoView({behavior:'smooth'});
}

function renderLib(){
  // 默认按年级推荐；学生可手动切全部或其他包
  const defaultPack = PACK_OF[CLASS.grade] || CLASS.theme_pack || 'cute_nature';
  const pack = currentPack || defaultPack;
  $('packName').textContent='· '+PACK_LABEL[pack];
  renderPackTabs(defaultPack, pack);
  const list = pack==='all' ? LIB : LIB.filter(x=>x.pack===pack);
  const box=$('lib'); box.innerHTML='';
  list.forEach(x=>{
    const d=document.createElement('div');
    d.className='pcard'+(selKind===x.kind?' sel':'');
    d.dataset.kind=x.kind;
    d.innerHTML=`<div class="ava">${creature(x.kind, RARITY_COLOR[x.rarity])}</div><div class="nm">${x.name}</div><span class="tag ${x.rarity}">${RARITY_LABEL[x.rarity]}</span>`;
    d.onclick=()=>choosePartner(x);
    box.appendChild(d);
  });
  if(me.partner_kind){ // 已认领则预选（在所有图鉴里找）
    const cur=LIB.find(x=>x.kind===me.partner_kind);
    if(cur && (pack==='all' || cur.pack===pack)) choosePartner(cur,true);
  }
}
function renderPackTabs(defaultPack, activePack){
  const tabs=$('packTabs'); tabs.innerHTML='';
  const order=['all',defaultPack==='all'?null:defaultPack].filter(Boolean);
  const others=Object.keys(PACK_LABEL).filter(k=>k!=='all' && !order.includes(k));
  [...order,...others].forEach(key=>{
    const b=document.createElement('button');
    b.textContent=PACK_SHORT[key]+(key===defaultPack?'（推荐）':'');
    b.className=(activePack===key?'sel':'');
    b.onclick=()=>{ currentPack=key; renderLib(); };
    tabs.appendChild(b);
  });
}

function choosePartner(x,silent){
  selKind=x.kind;
  document.querySelectorAll('#lib .pcard').forEach(c=>c.classList.toggle('sel', c.dataset.kind===x.kind));
  $('pvEmoji').innerHTML=creature(x.kind, selColor);
  $('pvName').textContent=x.name;
  $('nick').value = me.nickname || x.name;
  renderSwatches();
  if(!silent){
    $('stepInfo').classList.remove('hidden');
    $('stepInfo').scrollIntoView({behavior:'smooth'});
  }
}

function renderSwatches(){
  const box=$('swatches'); box.innerHTML='';
  SWATCHES.forEach(c=>{
    const s=document.createElement('div');
    s.className='sw'+(selColor===c?' sel':'');
    s.style.background=c; s.title=c;
    s.onclick=()=>{ selColor=c; renderSwatches(); if(selKind) $('pvEmoji').innerHTML=creature(selKind, selColor); };
    box.appendChild(s);
  });
}

async function claim(){
  $('claimErr').textContent='';
  if(!selKind){ $('claimErr').textContent='请先选一个伙伴'; return; }
  const nick=$('nick').value.trim();
  try{
    const res=await fetch('/api/students/'+me.id+'/claim',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({partner_kind:selKind, nickname:nick||null, color:selColor})
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||'认领失败'); }
    const data=await res.json();
    // R45: 保存设备令牌
    deviceToken = data.device_token;
    done(nick);
  }catch(err){ $('claimErr').textContent=err.message; }
}

function done(nick){
  const k=LIB.find(x=>x.kind===selKind);
  $('doneEmoji').innerHTML=creature(k.kind, selColor);
  $('doneTxt').textContent='认领成功！';
  $('doneSub').textContent=(nick||k.name)+' 已经住进「'+CLASS.name+'」的星球啦～ 打开老师的大屏就能看到它成长。';
  $('stepInfo').classList.add('hidden');
  $('stepDone').classList.remove('hidden');
  $('stepDone').scrollIntoView({behavior:'smooth'});
  confetti();
  toast('🎉 你的伙伴入住星球！');
  // 记住已认领，刷新后直接进主页
  try{ localStorage.setItem('gp_me', JSON.stringify({classCode:CLASS.class_code||CLASS.id, studentId:me.id, deviceToken:deviceToken})); }catch(e){}
  setTimeout(loadHome, 1800);
}

// 进入「我的伙伴」主页：拉取活动与生态值
async function loadHome(){
  if(!me || !me.partner_kind){ return; }
  document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
  $('stepHome').classList.remove('hidden');
  $('stepHome').scrollIntoView({behavior:'smooth'});
  await renderHome();
}

async function renderHome(){
  try{
    const res=await fetch('/api/students/'+me.id+'/activities');
    if(!res.ok) return;
    const v=await res.json();
    me.partner_kind=v.student.partner_kind;
    me.color=v.student.color||me.color;
    me.nickname=v.student.nickname||me.nickname;
    drawHome(v);
  }catch(e){}
}

const PET_PARTS = [
  { id:'head',    cx:50, cy:48, r:20, anim:'pet-nod',   bubbles:['你好呀！','嗨～','(点头)','开心！'], fx:'✨' },

  { id:'feet',    cx:50, cy:92, r:14, anim:'pet-dance', bubbles:['(跳舞)！','转圈圈～','蹦蹦跳！','耶！'], fx:'🌟' },
  { id:'cheek',   cx:35, cy:60, r:10, anim:'pet-nod',   bubbles:['(脸红)','害羞～','嘻嘻'], fx:'💕' },
];
let petClickCount = 0;

function addPetHotZones(){
  const svg=$('homeAva').querySelector('svg');
  if(!svg) return;
  // 移除旧热区
  svg.querySelectorAll('.hot-zone').forEach(el=>el.remove());
  const ns='http://www.w3.org/2000/svg';
  PET_PARTS.forEach(p=>{
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('class','hot-zone');
    c.setAttribute('cx',p.cx); c.setAttribute('cy',p.cy); c.setAttribute('r',p.r);
    c.setAttribute('data-part',p.id);
    c.addEventListener('click',()=>onPetClick(p));
    svg.appendChild(c);
  });
}

function onPetClick(part){
  const svg=$('homeAva').querySelector('svg.crt');
  if(!svg) return;
  // 播放动画
  PET_PARTS.forEach(p=>svg.classList.remove(p.anim));
  void svg.offsetWidth;
  svg.classList.add(part.anim);
  // 随机气泡
  const msg=part.bubbles[Math.floor(Math.random()*part.bubbles.length)];
  showPetBubble(msg);
  // 粒子特效
  if(part.fx) showPetFx(part.fx);
  // 彩蛋：连续点击 5 次
  petClickCount++;
  if(petClickCount%5===0){
    svg.classList.add('pet-spin');
    showPetBubble('🎉 彩蛋！伙伴转了一圈！');
    setTimeout(()=>svg.classList.remove('pet-spin'),700);
  }
}

function showPetBubble(msg){
  const wrap=$('homeAva');
  // 移除旧气泡
  wrap.querySelectorAll('.pet-bubble').forEach(el=>el.remove());
  const b=document.createElement('div');
  b.className='pet-bubble'; b.textContent=msg;
  wrap.appendChild(b);
  setTimeout(()=>{ b.classList.add('out'); setTimeout(()=>b.remove(),300); }, 1800);
}

function showPetFx(emoji){
  const wrap=$('homeAva');
  const f=document.createElement('div');
  f.className='pet-fx'; f.textContent=emoji;
  f.style.left=(35+Math.random()*30)+'%';
  f.style.top='30%';
  wrap.appendChild(f);
  setTimeout(()=>f.remove(),1100);
}

function drawHome(v){
  const k=LIB.find(x=>x.kind===v.student.partner_kind)||{name:'伙伴'};
  const color=v.student.color||SWATCHES[0];
  const total=v.totalPoints||0, today=v.todayPoints||0;
  const stage=Math.floor(total/5)+1;
  $('homeAva').innerHTML=creature(v.student.partner_kind, color);
  // R43: 添加部位点击热区
  addPetHotZones();
  $('homeName').textContent=(v.student.nickname||k.name)+' · Lv'+stage;
  $('homeSub').textContent=k.name+' · 已完成 '+(v.activities||[]).length+' 次互动';
  const pct=Math.min(100, (total%5)*20);
  $('ecoFill').style.width=(total%5===0&&total>0?100:pct)+'%';
  $('ecoVal').textContent=total;
  $('ecoToday').textContent=today;
  // 签到按钮今日禁用
  const checked=(v.activities||[]).some(a=>a.kind==='checkin' && new Date(a.created_at).toDateString()===new Date().toDateString());
  $('btnCheckin').disabled=checked;
  $('btnCheckin').textContent=checked?'✅ 今日已签到':'🌞 每日签到';
  // 活动记录
  const box=$('actLog'); box.innerHTML='';
  const list=(v.activities||[]).slice(0,12);
  const ICON={checkin:'🌞',quiz:'📚',observe:'🔍',homework:'📝'};
  const TXT={checkin:'每日签到',quiz:'课间答题',observe:'观察记录',homework:'提交作业'};
  if(!list.length){ box.innerHTML='<div class="empty">还没有互动记录，点上面的按钮和伙伴玩起来吧～</div>'; }
  list.forEach(a=>{
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="ic">${ICON[a.kind]||'⭐'}</span><span class="tx">${TXT[a.kind]||a.kind}${a.detail?('：'+a.detail):''}${a.kind==='quiz'?(a.correct?'（答对 +2）':'（答错）'):''}</span><span class="pt">+${a.points}</span>`;
    box.appendChild(r);
  });
}

// R47: 课间答题 — 服务端出题 → 学生选答 → 服务端判分
async function startQuiz(){
  $('actMsg').textContent='';
  const btn=$('btnQuiz'); const oldTxt=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.style.opacity='.6'; btn.textContent='⏳ 出题中…'; }
  try{
    // 1. 从服务端取题
    const res=await fetch('/api/students/'+me.id+'/quiz/next');
    const data=await res.json();
    if(!data.question){ $('actMsg').textContent=data.message||'暂无题目'; return; }
    showQuiz(data.question);
  }catch(err){ $('actMsg').textContent='取题失败：'+err.message; }
  finally{
    if(btn){ btn.disabled=false; btn.style.opacity=''; btn.textContent=oldTxt; }
  }
}

function showQuiz(q){
  // 构建答题弹窗
  let modal=document.getElementById('quizModal');
  if(!modal){
    modal=document.createElement('div');
    modal.id='quizModal';
    modal.style.cssText='position:fixed;inset:0;background:rgba(74,68,102,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;';
    document.body.appendChild(modal);
  }
  const optsHtml=q.options.map((o,i)=>`<button class="quiz-opt" data-idx="${i}" style="display:block;width:100%;margin:8px 0;padding:14px 16px;border:2px solid #EFE6F5;border-radius:14px;background:#fff;color:#4A4466;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;">${escapeHtml(o)}</button>`).join('');
  modal.innerHTML=`<div style="background:#fff;border-radius:24px;padding:28px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(170,140,200,.3);">
    <div style="font-size:17px;font-weight:800;margin-bottom:6px;color:#5A4E86;">📚 课间答题</div>
    ${q.unit?`<div style="font-size:12px;color:#8A84A8;margin-bottom:12px;">单元：${escapeHtml(q.unit)}</div>`:''}
    <div style="font-size:15px;line-height:1.7;margin-bottom:16px;color:#4A4466;">${escapeHtml(q.question)}</div>
    <div id="quizOpts">${optsHtml}</div>
    <div id="quizResult" style="display:none;margin-top:16px;"></div>
    <button id="quizClose" style="display:none;margin-top:14px;width:100%;padding:12px;border:none;border-radius:14px;background:linear-gradient(135deg,#C4A7FF,#8FC7FF);color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;">关闭</button>
  </div>`;
  modal.style.display='flex';

  modal.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.onclick=()=>submitQuiz(q.id, parseInt(btn.dataset.idx), modal);
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function submitQuiz(questionId, choice, modal){
  // 禁用所有选项
  modal.querySelectorAll('.quiz-opt').forEach(b=>{b.style.pointerEvents='none';b.style.opacity='.6';});
  modal.querySelector('#quizOpts').style.pointerEvents='none';

  try{
    const res=await fetch('/api/students/'+me.id+'/quiz',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Device-Token':deviceToken||''},
      body:JSON.stringify({question_id:questionId, choice})
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'提交失败');

    // 标注正确/错误
    modal.querySelectorAll('.quiz-opt').forEach((b,i)=>{
      if(i===data.answer){ b.style.borderColor='#7FE3C0'; b.style.background='#F0FFF8'; }
      if(i===choice && !data.correct){ b.style.borderColor='#FF9EC9'; b.style.background='#FFF0F5'; }
    });

    const result=modal.querySelector('#quizResult');
    result.style.display='block';
    if(data.correct){
      result.innerHTML=`<div style="text-align:center;font-size:18px;font-weight:800;color:#2f8f6f;">✅ 答对了！生态值 +${data.points}</div>${data.explanation?`<div style="font-size:13px;color:#6f6691;margin-top:8px;line-height:1.6;">💡 ${escapeHtml(data.explanation)}</div>`:''}`;
    }else{
      result.innerHTML=`<div style="text-align:center;font-size:18px;font-weight:800;color:#d8506a;">❌ 答错了，再加油～</div>${data.explanation?`<div style="font-size:13px;color:#6f6691;margin-top:8px;line-height:1.6;">💡 ${escapeHtml(data.explanation)}</div>`:''}`;
    }
    modal.querySelector('#quizClose').style.display='block';
    modal.querySelector('#quizClose').onclick=()=>{ modal.style.display='none'; renderHome(); };

    // 跳动反馈
    const av=$('homeAva').querySelector('.crt'); if(av){ av.classList.remove('hop'); void av.offsetWidth; av.classList.add('hop'); }
    toast('🎉 答题完成！');
  }catch(err){
    $('actMsg').textContent=err.message;
    modal.style.display='none';
  }
}

async function doActivity(kind){
  $('actMsg').textContent='';
  let body={kind};
  if(kind==='observe'){
    const t=prompt('记录一条你的观察（例如：今天蚕宝宝又蜕皮了，白白的～）：','');
    if(t===null) return;
    body.detail=(t||'').slice(0,200);
  }else if(kind==='homework'){
    const t=prompt('提交今天的科学作业（写一句你完成了什么，例如：完成了「水的三态」观察实验）：','');
    if(t===null) return;
    body.detail=(t||'').slice(0,200);
  }
  // 点击立即反馈：禁用按钮+loading，不再干等网络往返
  const btn=$('btn'+kind.charAt(0).toUpperCase()+kind.slice(1));
  const oldTxt=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.style.opacity='.6'; btn.textContent='⏳ 记录中…'; }
  $('actMsg').textContent='⏳ 正在记录…';
  try{
    const res=await fetch('/api/students/'+me.id+'/activity',{
      method:'POST', headers:{'Content-Type':'application/json','X-Device-Token':deviceToken||''}, body:JSON.stringify(body)
    });
    const v=await res.json();
    if(!res.ok){ throw new Error(v.error||'提交失败'); }
    if(v.already){ $('actMsg').textContent=v.message||'今天已经签到啦'; }
    else { $('actMsg').textContent='✨ 伙伴好开心！生态值 +'+(v.totalPoints||''); }
    // 跳动反馈
    const av=$('homeAva').querySelector('.crt'); if(av){ av.classList.remove('hop'); void av.offsetWidth; av.classList.add('hop'); }
    toast('🎉 互动成功！');
    await renderHome();
  }catch(err){ $('actMsg').textContent=err.message; }
  finally{
    if(btn){ btn.disabled=false; btn.style.opacity=''; btn.textContent=oldTxt; }
  }
}

// R46: 申请换伙伴（需老师授权）
async function requestSwitch(){
  if(!confirm('要换一个科学伙伴吗？\n换伙伴需要老师授权后才能生效哦～')) return;
  // 重新打开选伙伴页
  document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
  $('stepPick').classList.remove('hidden');
  renderLib();
  $('stepPick').scrollIntoView({behavior:'smooth'});
  // 记录待提交的换伙伴状态
  window._switchingPartner = true;
}

// 修改 claim 函数处理换伙伴申请
async function claim(){
  $('claimErr').textContent='';
  if(!selKind){ $('claimErr').textContent='请先选一个伙伴'; return; }
  const nick=$('nick').value.trim();

  if(window._switchingPartner){
    // R46: 提交换伙伴申请
    try{
      const res=await fetch('/api/students/'+me.id+'/partner-change',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({requested_kind:selKind})
      });
      if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||'申请失败'); }
      window._switchingPartner=false;
      $('claimErr').textContent='';
      toast('✅ 换伙伴申请已提交！等老师授权后生效～');
      setTimeout(()=>loadHome(), 1500);
    }catch(err){ $('claimErr').textContent=err.message; }
    return;
  }

  try{
    const res=await fetch('/api/students/'+me.id+'/claim',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({partner_kind:selKind, nickname:nick||null, color:selColor})
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||'认领失败'); }
    const data=await res.json();
    // R45: 保存设备令牌
    deviceToken = data.device_token;
    done(nick);
  }catch(err){ $('claimErr').textContent=err.message; }
}

function confetti(){
  const box=$('confetti'); box.innerHTML='';
  const colors=['#FF9EC9','#7FE3C0','#FFD86B','#8FC7FF','#C4A7FF'];
  for(let i=0;i<80;i++){
    const c=document.createElement('i');
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2+Math.random()*1.8)+'s';
    c.style.animationDelay=(Math.random()*0.6)+'s';
    c.style.transform='rotate('+(Math.random()*360)+'deg)';
    box.appendChild(c);
  }
  setTimeout(()=>box.innerHTML='',3600);
}

function resetAll(){
  CLASS=null; STUDENTS=[]; me=null; selKind=null; deviceToken=null;
  try{ localStorage.removeItem('gp_me'); }catch(e){}
  ['stepWho','stepPick','stepInfo','stepDone','stepHome'].forEach(id=>$(id).classList.add('hidden'));
  $('stepCode').classList.remove('hidden');
  $('codeInput').value='';
}
