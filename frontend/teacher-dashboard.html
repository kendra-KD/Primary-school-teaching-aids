<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>成长星球 · 科学班生态</title>
<script>window.GP_API_BASE = '__GP_API_BASE__';</script>
<style>
:root{
  --bg1:#1b1636; --bg2:#241a47; --bg3:#15263f;
  --glass:rgba(255,255,255,.07);
  --glass-strong:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14);
  --txt:#ECE9F7; --txt2:#A89FCB; --txt3:#7C729E;
  --accent:#8be9d4; --accent2:#b58cff; --accent3:#ff9ec9;
  --good:#7FD1B4; --warn:#FFD6A5; --bad:#FF9E9E;
  --r:22px;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  color:var(--txt);
  background:
    radial-gradient(1200px 800px at 12% -10%, rgba(181,140,255,.22), transparent 60%),
    radial-gradient(1000px 700px at 100% 0%, rgba(139,233,212,.18), transparent 55%),
    radial-gradient(900px 900px at 60% 120%, rgba(255,158,201,.16), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-attachment:fixed;
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 柔和星点 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,.5), transparent);
}
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:18px 18px 120px;}
@media(max-width:1366px){.app{padding:14px 14px 110px;}}
@media(max-width:1100px){.app{padding:12px 12px 100px;}}

/* ===== 顶部栏 ===== */
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;box-shadow:0 10px 40px rgba(0,0,0,.28);
}
@media(max-width:1366px){.topbar{padding:10px 12px;gap:10px;}}
@media(max-width:768px){.topbar{padding:8px 10px;gap:8px;font-size:13px;}}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.5px;}
.brand .logo{width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#8be9d4 40%,#5fae9f 80%);
  box-shadow:0 0 16px rgba(139,233,212,.6);}
.chips{display:flex;gap:8px;flex:1;flex-wrap:wrap;}
.chip{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:14px;cursor:pointer;
  background:var(--glass);border:1px solid transparent;transition:.2s;min-width:0;
}
.chip:hover{background:var(--glass-strong);}
.chip.active{border-color:var(--accent);box-shadow:0 0 14px rgba(139,233,212,.35);}
.chip .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor;}
.chip .ct{font-weight:800;font-size:13px;white-space:nowrap;}
.chip .cs{font-size:11px;color:var(--txt2);white-space:nowrap;}
.spacer{flex:1;}
.stage-pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:var(--glass);}
.stage-pill b{font-size:14px;}
.timer{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:14px;padding:6px 10px;}
.timer .clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:16px;min-width:54px;text-align:center;}
.timer button{font:inherit;font-weight:800;font-size:12px;color:var(--txt);background:var(--glass-strong);
  border:1px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer;transition:.15s;}
.timer button:hover{background:rgba(255,255,255,.2);}

/* ===== 主区 ===== */
.main{display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:18px;}
@media(max-width:1366px){.main{gap:14px;margin-top:14px;grid-template-columns:1fr 300px;}}
@media(max-width:900px){.main{grid-template-columns:1fr;gap:12px;margin-top:12px;}}

/* 星球面板 */
.planet-wrap{
  position:relative;border-radius:28px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(181,140,255,.18), transparent 60%),
    radial-gradient(100% 80% at 50% 100%, rgba(139,233,212,.14), transparent 60%),
    var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(14px);
  box-shadow:0 18px 60px rgba(0,0,0,.32), inset 0 0 60px rgba(139,233,212,.06);
  padding:18px;
}
@media(max-width:1366px){.planet-wrap{padding:14px;}}
@media(max-width:768px){.planet-wrap{padding:10px;border-radius:20px;}}
.planet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.planet-title{display:flex;align-items:center;gap:12px;}
.planet-title .big{width:64px;height:64px;filter:drop-shadow(0 0 10px var(--accent));}
.planet-title .stage{font-size:20px;font-weight:900;}
.planet-title .sub{font-size:12px;color:var(--txt2);}
.planet-stats{display:flex;gap:10px;align-items:center;}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;min-width:78px;}
@media(max-width:1366px){.stat{padding:6px 10px;min-width:66px;}}
.stat .v{font-size:20px;font-weight:900;}
.stat .k{font-size:11px;color:var(--txt2);}
@media(max-width:1366px){.stat .v{font-size:17px;}.stat .k{font-size:10px;}}
.ring{position:relative;width:64px;height:64px;}
.ring svg{position:absolute;inset:0;}

.planet{position:relative;min-height:420px;border-radius:22px;
  background:radial-gradient(circle at 50% 45%, rgba(181,140,255,.10), transparent 70%);}
@media(max-width:1366px){.planet{min-height:360px;}}
@media(max-width:768px){.planet{min-height:300px;}}
#vines{position:absolute;inset:0;pointer-events:none;z-index:3;}
#planetGrid{position:relative;z-index:2;display:grid;gap:14px;padding:8px;}
@media(max-width:1366px){#planetGrid{gap:10px;padding:4px;}}
.partner{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:12px 8px 10px;border-radius:18px;cursor:pointer;
  background:var(--glass);border:1px solid transparent;transition:transform .18s,box-shadow .18s,background .18s;
  animation:float 5s ease-in-out infinite;
}
@media(max-width:1366px){.partner{padding:10px 6px 8px;border-radius:16px;gap:3px;}}
@media(max-width:768px){.partner{padding:8px 4px 6px;border-radius:14px;}}
.partner:nth-child(2n){animation-delay:-1.2s;}
.partner:nth-child(3n){animation-delay:-2.4s;}
.partner:hover{transform:translateY(-3px);background:var(--glass-strong);}
.partner.sel{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-3px) scale(1.03);}
.partner .score{position:absolute;top:8px;right:10px;font-size:12px;font-weight:900;color:var(--c);
  background:rgba(0,0,0,.25);border-radius:10px;padding:1px 7px;}
.partner .blob{width:74px;height:74px;position:relative;display:grid;place-items:center;
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 60%,transparent));}
@media(max-width:1366px){.partner .blob{width:62px;height:62px;}}
@media(max-width:768px){.partner .blob{width:52px;height:52px;}}
.partner .blob svg{width:100%;height:100%;}
.partner .blob.glow{animation:pop .9s ease;}
.partner .fx{position:absolute;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:1px;padding-top:2px;}
.partner .fx span{width:13px;height:13px;opacity:.95;}
.partner .name{font-size:13px;font-weight:800;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.partner .grp{font-size:10px;color:var(--txt2);}
.partner .badge{position:absolute;top:8px;left:8px;font-size:14px;}
.partner .carepill{position:absolute;bottom:-6px;font-size:10px;font-weight:800;color:#fff;background:var(--bad);
  border-radius:8px;padding:1px 6px;box-shadow:0 0 10px var(--bad);}
.partner.wilt{filter:grayscale(.5) brightness(.8);}
.partner.injured .blob{animation:shake .5s;}
.partner.loved{box-shadow:0 0 18px rgba(255,158,201,.5);}
.partner .spark{position:absolute;top:6px;left:50%;margin-left:-12px;font-size:22px;animation:sparkFloat 2.5s ease-out forwards;pointer-events:none;z-index:5;}
@keyframes sparkFloat{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1;transform:translate(calc(var(--dx,0px)*.3),calc(var(--dy,0px)*.3)) scale(1.3)}60%{opacity:1;transform:translate(var(--dx,0px),var(--dy,0px)) scale(1)}100%{opacity:0;transform:translate(calc(var(--dx,0px)*1.5),calc(var(--dy,0px)*1.5 - 30px)) scale(.8)}}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pin-shake{animation:shake .35s ease-in-out 2;}
/* 大屏计时器全屏模式 */
.fullscreen-timer{position:fixed;inset:0;z-index:9999;background:rgba(16,12,28,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.fullscreen-timer .fs-num{font-size:clamp(8rem,22vw,20rem);font-weight:900;color:#A8E6CF;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 40px rgba(168,230,207,.4);}
.fullscreen-timer .fs-label{font-size:1.5rem;color:#9A94A6;margin-top:1rem;letter-spacing:2px;}
.fullscreen-timer .fs-close{position:fixed;top:2rem;right:2rem;font-size:1.2rem;color:#9A94A6;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 18px;cursor:pointer;}
.fullscreen-timer .fs-close:hover{color:#F4EFE7;}
/* 装扮穿戴点击态 */
.ditem.wearing{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 12px rgba(168,230,207,.5);}
.ditem.wearing .dn::before{content:'✓ 穿戴中 ';color:var(--accent);font-size:10px;}
.ditem .wear-btn{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--glass-strong);color:var(--accent);border:1px solid var(--line);cursor:pointer;margin-top:4px;}
.ditem.lock .wear-btn{display:none;}
.wear-layer{position:absolute;top:-8px;left:50%;width:28px;height:28px;transform:translateX(-50%);pointer-events:none;z-index:6;}
.wear-layer .wear-svg{width:100%;height:100%;}
/* 点评装饰永久佩戴 —— 星球墙上的花/叶更大更明显 */
.partner .fx{position:absolute;inset:0;pointer-events:none;display:flex;gap:3px;justify-content:center;align-items:flex-end;padding-bottom:2px;}
.partner .fx span{width:20px;height:20px;display:block;}
.partner .fx span svg{width:100%;height:100%;}
.partner .fx-big span{width:28px;height:28px;}

/* ===== 伙伴生物动画（呼吸 / 眨眼 / 摆动手足） ===== */
.partner .blob{transition:transform .2s ease;}
.partner .blob svg, .selava svg, .gava svg, .ravi svg{display:block;width:100%;height:100%;overflow:visible;}
.crt{animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 82%;}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.018)}}
.c-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite;}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.c-wig{transform-box:fill-box;transform-origin:center;animation:wig 3.2s ease-in-out infinite;}
@keyframes wig{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
/* hover 唤醒：生物放大、眼睛睁大、停止打盹 */
.partner:hover .crt{animation-duration:1.1s;transform:scale(1.07);}
.partner:hover .blob{transform:translateY(-3px) scale(1.05);}
/* 被选中 / 点评时的快乐跳动 */
.crt.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1);}
@keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-9px) scale(1.12)}60%{transform:translateY(0) scale(.96)}100%{transform:translateY(0) scale(1)}}
.partner.sel .crt{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 70%,transparent));}
/* 状态视觉：受伤发抖已存在；爱护发光；蔫了下垂 */
.partner.loved .crt{filter:drop-shadow(0 0 7px #ff9ec9);}
.partner.loved .crt::after{content:"";position:absolute;}
.partner.wilt .crt{transform:rotate(-8deg) translateY(4px);transform-origin:50% 90%;}
/* 爱护态飘心 */
.partner.loved .blob::before{content:"💗";position:absolute;top:-4px;right:6px;font-size:14px;
  animation:heartUp 2.4s ease-in-out infinite;pointer-events:none;}
@keyframes heartUp{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-6px);opacity:1}}

/* 侧栏 */
.side{display:flex;flex-direction:column;gap:16px;}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
@media(max-width:1366px){.panel{padding:14px;}}
@media(max-width:768px){.panel{padding:12px;border-radius:18px;}}
.panel h3{font-size:14px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--txt);}
.selcard{display:flex;align-items:center;gap:12px;min-height:64px;
  background:var(--glass);border:1px dashed var(--line);border-radius:16px;padding:10px 12px;color:var(--txt2);font-size:13px;}
.selcard:not(.empty){color:var(--txt);border-style:solid;}
.selcard .selava{width:48px;height:48px;flex:none;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 60%,transparent));}
.selcard .selava svg{width:100%;height:100%;}
.selcard .sn{font-weight:900;font-size:15px;}
.selcard .ss{font-size:11px;color:var(--txt2);}
.sel-actions{display:flex;gap:8px;margin-top:10px;}
.btn{font:inherit;font-weight:800;font-size:13px;border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;cursor:pointer;color:var(--txt);background:var(--glass-strong);transition:.15s;}
.btn:hover{background:rgba(255,255,255,.2);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1b1536;border:none;box-shadow:0 6px 18px rgba(139,233,212,.35);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.board{display:flex;flex-direction:column;gap:8px;}
.bcard{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--glass);}
.bcard .medal{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;}
.bcard .bmain{flex:1;min-width:0;}
.bcard .bt{font-size:11px;color:var(--txt2);}
.bcard .bn{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bcard .bv{font-size:11px;color:var(--accent);font-weight:800;white-space:nowrap;}

/* ===== 点评 Dock ===== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px 14px;
  background:linear-gradient(0deg,rgba(20,15,40,.92),rgba(20,15,40,.55) 70%,transparent);
  backdrop-filter:blur(6px);transition:.25s;}
@media(max-width:1366px){.dock{padding:8px 14px 12px;}}
@media(max-width:768px){.dock{padding:6px 10px 10px;}}
.dock-inner{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.dock .dock-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dock .dock-toggle{font:inherit;font-weight:800;font-size:12px;cursor:pointer;border-radius:12px;padding:7px 11px;
  color:var(--txt);background:var(--glass-strong);border:1px solid var(--line);transition:.15s;white-space:nowrap;}
.dock .dock-toggle:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.25);}
.dock .dock-toggle.active{background:var(--accent);color:#1b1636;border-color:var(--accent);}
.group{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;animation:rise .25s ease;}
.gt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--txt2);min-width:64px;margin-top:6px;}
.gt .gd{width:9px;height:9px;border-radius:50%;background:var(--gc);box-shadow:0 0 8px var(--gc);}
.chips-tags{display:flex;gap:7px;flex-wrap:wrap;}
.tag{font:inherit;font-weight:800;font-size:12px;cursor:pointer;border-radius:12px;padding:7px 11px;
  color:var(--txt);background:color-mix(in srgb,var(--gc) 22%,var(--glass-strong));
  border:1px solid color-mix(in srgb,var(--gc) 45%,transparent);transition:.15s;}
.tag:hover{transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--gc) 40%,transparent);}
.tag .v{opacity:.8;margin-left:3px;font-size:11px;}
.tag.neg{background:rgba(255,158,158,.16);border-color:rgba(255,158,158,.5);color:#ffc9c9;}
.dock .hint{font-size:11px;color:var(--txt2);opacity:.8;}
#tagRow{max-height:42vh;overflow-y:auto;scrollbar-width:thin;}
.report{max-width:720px;margin:24px auto;background:#fff;color:#222;border-radius:16px;padding:28px 32px;box-shadow:0 18px 50px rgba(0,0,0,.45);}
.report h1{font-size:22px;margin:0 0 6px;}
.report .r-meta{color:#666;font-size:13px;margin-bottom:18px;}
.report section{margin:18px 0;}
.report h2{font-size:16px;border-left:4px solid #8BE9D4;padding-left:8px;margin:0 0 10px;}
.report .r-kpi{display:flex;gap:14px;flex-wrap:wrap;}
.report .r-kpi div{flex:1;min-width:120px;background:#f2f7f6;border-radius:12px;padding:14px;text-align:center;}
.report .r-kpi span{display:block;font-size:24px;font-weight:900;color:#2E6B5E;}
.report ol{margin:0;padding-left:22px;line-height:2;}
.report .r-line{margin-top:8px;color:#444;}
.report .r-msg{width:100%;min-height:90px;border:1px solid #ddd;border-radius:10px;padding:10px;font:inherit;resize:vertical;box-sizing:border-box;}
.report .r-actions{margin-top:18px;display:flex;gap:10px;}
.report .btn{background:#8BE9D4;color:#143;font-weight:800;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font:inherit;}
.report .btn.ghost{background:#eee;color:#555;}
@media print{
  body *{visibility:hidden!important;}
  #rOverlay,#rOverlay *{visibility:visible!important;}
  #rOverlay{position:absolute!important;inset:0!important;background:#fff!important;display:flex!important;align-items:flex-start!important;overflow:visible!important;}
  .report{box-shadow:none!important;margin:0 auto!important;}
  .no-print{display:none!important;}
}

/* ===== 浮层通用 ===== */
.overlay{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(15,10,30,.55);backdrop-filter:blur(4px);padding:18px;}
.overlay.show{display:flex;}
.modal{width:min(560px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#241a47,#1b1636);
  border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.5);}
.modal .close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--glass);color:var(--txt);font-size:18px;cursor:pointer;}
.modal h2{font-size:17px;font-weight:900;margin-bottom:14px;}
/* 花名册 */
.roster-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.roster-tools input,.modal input{font:inherit;font-size:13px;padding:9px 11px;border-radius:12px;border:1px solid var(--line);
  background:var(--glass);color:var(--txt);outline:none;}
.roster-tools input{flex:1;min-width:120px;}
.ritem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--glass);margin-bottom:8px;}
.ritem .ravi{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 60%,transparent));}
.ritem input{flex:1;min-width:0;}

/* 成长卡 */
.ghead{display:flex;gap:14px;align-items:center;margin-bottom:14px;}

.gn{font-size:18px;font-weight:900;}
.gm{font-size:12px;color:var(--txt2);}

.tnode .tl{font-size:11px;margin-top:5px;color:var(--txt2);}
.tline{position:absolute;top:15px;left:50%;width:100%;height:3px;background:var(--line);z-index:1;}

.netcard{display:flex;gap:14px;align-items:center;}

.netnote{font-size:12px;color:var(--txt2);line-height:1.6;}

.actlist .empty{font-size:12px;color:var(--txt2);opacity:.7;padding:6px 2px;}

#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-20px);z-index:120;

#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

hidden{display:none!important;}

.nc-field input:focus,.nc-field select:focus{border-color:rgba(126,209,180,.6);}
.nc-field select option{background:#241f38;color:#fff;}
.nc-ok{width:100%;padding:11px;font-size:14px;}

      mk('顾言','crystal',PALETTE[7],'active',16,1,[0,1]), mk('沈知夏','fish',PALETTE[9],'loved',22,2,[3]),
      mk('乔安','crystal',PALETTE[11],'active',14,0), mk('唐果','fish',PALETTE[0],'active',17,3),

/* =====================================================================

/* =====================================================================
   伙伴 SVG 图鉴（36 种独立形象，按 partner_kind 一一映射）
   统一治愈发光体 + 学生主色点缀；每种有可辨识轮廓与性格动作
   ===================================================================== */
function creature(type,color){
  const E='#F4EFE7', K='#3A3550', c=color||'#8be9d4';
  // 通用表情：眼睛(可眨) + 微笑 + 腮红(学生主色)
  const face=(cx,cy,o={})=>{
    const dx=o.dx||5, er=o.er||3;
    const e=`<circle class="c-eye" cx="${cx-dx}" cy="${cy}" r="${er}" fill="${K}"/><circle class="c-eye" cx="${cx+dx}" cy="${cy}" r="${er}" fill="${K}"/>`+
            `<circle cx="${cx-dx-1}" cy="${cy-1}" r="1" fill="#fff"/><circle cx="${cx+dx-1}" cy="${cy-1}" r="1" fill="#fff"/>`;
    const sm=o.smile===false?'':`<path d="M${cx-dx*0.7} ${cy+5} q${dx*0.7} 5 ${dx*1.4} 0" stroke="${K}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    const bl=o.blush===false?'':`<circle cx="${cx-dx*1.7}" cy="${cy+3}" r="2.3" fill="${c}" opacity=".55"/><circle cx="${cx+dx*1.7}" cy="${cy+3}" r="2.3" fill="${c}" opacity=".55"/>`;
    return e+sm+bl;

/* =====================================================================
   音效（Web Audio 简单"叮"）
   ===================================================================== */
let actx=null;
function ding(kind){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    let f=523.25, dur=.6, type='sine';
    if(kind==='bloom'){f=880;dur=.7;}
    else if(kind==='evolve'){f=660;dur=.8;type='triangle';}
    else if(kind==='love'){f=784;dur=.7;}
    else if(kind==='neg'){f=233;dur=.5;type='sine';}
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.22,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}

const $=id=>document.getElementById(id);

function ringSVG(pct,size,color){
  const r=(size-12)/2, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+5}" text-anchor="middle" font-size="${size*0.30}" font-weight="900" fill="${color}">${Math.round(pct*100)}%</text>
  </svg>`;
}
function stageInfo(pct){
  if(pct<0.34) return {name:'荒芜星球',color:'#C9B8A8',short:'荒芜',sub:'播下第一颗种子吧'};
  if(pct<0.70) return {name:'绿意星球',color:'#7FD1B4',short:'绿意',sub:'绿芽正在舒展～'};
  return {name:'繁荣星球',color:'#FF9EC4',short:'繁荣',sub:'生态欣欣向荣！'};
}

function renderBoard(){
  const cls=CLASSES[currentClass]; const S=cls.students;
  const grpScore=[0,0,0,0];
  S.forEach((s,i)=>grpScore[i%4]+=s.score);
  let bestG=0; grpScore.forEach((v,i)=>{if(v>grpScore[bestG])bestG=i;});
  let bestPair=null,bestN=0;
  for(let i=0;i<S.length;i++)for(const j of S[i].vines){ if(j>i){const n=pairVines(i,j); if(n>bestN){bestN=n;bestPair=[i,j];}} }
  function pairVines(a,b){return (S[a].vines.includes(b)?1:0)+(S[b].vines.includes(a)?1:0);}
  let askBest=0; S.forEach((s,i)=>{if(s.ask>askBest)askBest=i;});
  let loveBest=0,loveMax=-1; S.forEach((s,i)=>{const lv=(s.state==='loved'?1:0); if(lv>loveMax){loveMax=lv;loveBest=i;}});
  const tidyColor = cls.tidy>75?'#7FD1B4':cls.tidy>50?'#FFD6A5':'#FF9E9E';
  const cards=[
    {m:'🥇',c:'#FFE5A0',t:'最繁荣小组（小队）',n:GROUPS[bestG],v:`${grpScore[bestG]} 生态值`},
    {m:'🤝',c:'#A0D2FF',t:'最佳搭档',n:bestPair?`${esc(S[bestPair[0]].n)} & ${esc(S[bestPair[1]].n)}`:'期待第一次合作',v:`${bestN} 根藤蔓`},
    {m:'💡',c:'#CDB4FF',t:'最爱提问',n:esc(S[askBest].n),v:`${S[askBest].ask} 次好问题`},
    {m:'💗',c:'#FFB3C6',t:'生命守护星',n:esc(S[loveBest].n),v:loveMax>0?'温柔守护中':'一起爱护生命'},
    {m:'🧹',c:tidyColor,t:'星球整洁度',n:cls.tidy>75?'整洁如新':cls.tidy>50?'还算整洁':'该整理啦',v:`${cls.tidy}%`},
  ];
  $('boardList').innerHTML=cards.map(c=>`
    <div class="bcard">
      <div class="medal" style="background:${c.c}33">${c.m}</div>
      <div class="bmain"><div class="bt">${c.t}</div><div class="bn">${c.n}</div></div>
      <div class="bv">${c.v}</div>
    </div>`).join('');
}

  let askBest=0; S.forEach((s,i)=>{ if((s.ask||0)>(S[askBest]?S[askBest].ask||0:0)) askBest=i; });
  const tidyTxt=cls.tidy>75?'整洁如新':cls.tidy>50?'还算整洁':'该整理啦';

function applyTag(gi,ti){
  // R50: 授课锁定 —— 防止学生上讲台乱点加分；老师输 PIN 解锁一次（本课有效）
  if(GP.lessonActive()){
    let unlocked=false;
    try{ unlocked=sessionStorage.getItem('gp_unlocked')==='1'; }catch(e){}
    if(!unlocked){
      GP.pinPrompt('🔒 授课锁定中：点评需输入 PIN 解锁').then(input=>{
        if(input===null){ return; }
        if(String(input).trim()!==String(GP.lessonPin)){ GP.pinShake(); toast('❌ PIN 不正确，已拦截本次点评'); return; }
        try{ sessionStorage.setItem('gp_unlocked','1'); }catch(e){}
        toast('🔓 已解锁，本节课可正常点评');
        applyTag(gi,ti);
      });
      return;
    }
  }
  if(selectedId===null){ toast('请先点一个伙伴 👆'); return; }
  const cls=CLASSES[currentClass]; const s=cls.students[selectedId];
  const tag=TAG_GROUPS[gi].tags[ti]; if(!tag) return;
  const eff=tag.effect;
  const el=document.querySelector(`.partner[data-i="${selectedId}"]`);
  const blob=el.querySelector('.blob');

  if(eff==='bloom'){ s.decor.push('flower'); s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.01*tag.v); ding('bloom'); flash(blob,'glow'); spawnSpark(el,'🌸'); }
  else if(eff==='evolve'){ s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.015*tag.v); el.classList.add('evolve'); setTimeout(()=>el.classList.remove('evolve'),800); ding('evolve'); spawnSpark(el,'✨'); if(ti===1||tag.label.includes('长期')) s.decor.push('leaf'); }
  else if(eff==='glow'){ s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.01*tag.v); flash(blob,'glow'); ding('glow'); }
  else if(eff==='leaf'){ s.decor.push('leaf'); s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.01*tag.v); ding('bloom'); spawnSpark(el,'🍃'); }
  else if(eff==='knowleaf'){ s.decor.push('know'); s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.008*tag.v); ding('bloom'); }
  else if(eff==='love'){ s.state='loved'; s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.012*tag.v); ding('love'); spawnSpark(el,'💗'); }
  else if(eff==='vine'){
    let target; do{ target=Math.floor(Math.random()*cls.students.length);}while(target===selectedId);
    if(!s.vines.includes(target)) s.vines.push(target);
    if(!cls.students[target].vines.includes(selectedId)) cls.students[target].vines.push(selectedId);
    s.score+=tag.v; cls.eco+=tag.v; flash(blob,'glow'); ding('glow'); renderVines();
  }
  else if(eff==='wilt'){ s.state='wilt'; ding('neg'); toast(`${s.n} 的伙伴蔫了，明天养回来就好 🌱`); }
  else if(eff==='injured'){ s.state='injured'; ding('neg'); toast(`${s.n} 的伙伴受伤了，请用"照料"动作恢复 💗`); }
  else if(eff==='tidy'){ cls.tidy=Math.max(0,cls.tidy-8); toast('星球整洁度下降，课后一起整理吧 🧹'); }

  if(eff!=='wilt'&&eff!=='injured'&&eff!=='tidy') s.ask = (TAG_GROUPS[gi].name==='思维'&&ti===0)? s.ask+1 : s.ask;

  saveClass(currentClass);
  renderPlanet(); selectedId=selectedId;
  document.querySelectorAll('.partner').forEach(e=>e.classList.toggle('sel',+e.dataset.i===selectedId));
  renderTopbar(); renderBoard(); updateSelPanel();
  toast(`${s.n} · ${tag.label} ${tag.v>0?'+'+tag.v:''} ✨`);
}

function flash(blob,clsName){blob.classList.add(clsName);setTimeout(()=>blob.classList.remove(clsName),2200);
  const svg=blob.querySelector('svg'); if(svg){ svg.classList.remove('hop'); void svg.offsetWidth; svg.classList.add('hop'); setTimeout(()=>svg.classList.remove('hop'),800); }}
function spawnSpark(el,emo){
  // 粒子更大更多、持续 2.5 秒，大屏投影也看得清
  for(let k=0;k<5;k++){
    const s=document.createElement('div'); s.className='spark';
    s.textContent=emo;
    const dx=(Math.random()-0.5)*60, dy=(Math.random()-0.5)*60;
    s.style.setProperty('--dx',dx+'px'); s.style.setProperty('--dy',dy+'px');
    s.style.fontSize=(16+Math.random()*10)+'px';
    s.style.animationDelay=(k*80)+'ms';
    el.appendChild(s);
    setTimeout(()=>s.remove(),2500);
  }
}

function measureCenters(){
  const scene=$('planet'), grid=$('planetGrid');
  const sr=scene.getBoundingClientRect();
  CLASSES[currentClass].students.forEach((s,i)=>{
    const el=grid.querySelector(`.partner[data-i="${i}"]`);
    if(!el)return; const r=el.getBoundingClientRect();
    s._cx=r.left+r.width/2-sr.left; s._cy=r.top+r.height/2-sr.top;
  });
}
function renderVines(){
  const scene=$('planet'), svg=$('vines');
  const sr=scene.getBoundingClientRect();
  svg.setAttribute('width',sr.width); svg.setAttribute('height',sr.height);
  svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);
  const S=CLASSES[currentClass].students; let paths='';
  for(let i=0;i<S.length;i++){
    for(const j of S[i].vines){
      if(j<=i)continue; const a=S[i],b=S[j];
      if(a._cx==null||b._cx==null)continue;
      const mx=(a._cx+b._cx)/2, my=(a._cy+b._cy)/2-26;
      paths+=`<path d="M${a._cx} ${a._cy} Q ${mx} ${my} ${b._cx} ${b._cy}" fill="none" stroke="#9BD9A8" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/>`;
      paths+=`<circle cx="${mx}" cy="${my}" r="7" fill="#A8E6CF" stroke="#fff" stroke-width="2"/>`;
      paths+=`<path d="M${mx} ${my} q-8 -4 -10 -12 q9 1 12 11z" fill="#8fd18f"/>`;
    }
  }
  svg.innerHTML=paths;
}

let tSec=0,tTimer=null;
function onTimerStart(){

  else{tTimer=setInterval(()=>{tSec++;const m=String(Math.floor(tSec/60)).padStart(2,'0');const s=String(tSec%60).padStart(2,'0');$('timerTxt').textContent=m+':'+s;},1000);$('tStart').textContent='暂停';}
}

function onTimerFs(){
  // 全屏超大计时：考试/做题全班可见
  const existing=document.getElementById('fsTimer'); if(existing){ existing.remove(); return; }
  const fs=document.createElement('div'); fs.id='fsTimer'; fs.className='fullscreen-timer';
  const fmt=()=>{ const m=String(Math.floor(tSec/60)).padStart(2,'0'); const s=String(tSec%60).padStart(2,'0'); return m+':'+s; };
  fs.innerHTML=`<button class="fs-close" title="退出全屏（Esc）">✕ 退出</button><div class="fs-num" id="fsNum">${fmt()}</div><div class="fs-label" id="fsLabel">${tTimer?'⏱ 计时中':'⏸ 已暂停'}</div>`;
  document.body.appendChild(fs);
  const upd=()=>{ const n=document.getElementById('fsNum'); const l=document.getElementById('fsLabel'); if(n) n.textContent=fmt(); if(l) l.textContent=tTimer?'⏱ 计时中':'⏸ 已暂停'; };
  fs.querySelector('.fs-close').onclick=()=>{ clearInterval(fs._iv); fs.remove(); };
  fs.onclick=e=>{ if(e.target===fs){ clearInterval(fs._iv); fs.remove(); } };
  // 点击数字也能暂停/继续
  fs.querySelector('.fs-num').onclick=(e)=>{ e.stopPropagation(); onTimerStart(); };
  document.addEventListener('keydown',function escH(e){ if(e.key==='Escape'){ const f=document.getElementById('fsTimer'); if(f){ clearInterval(f._iv); f.remove(); } document.removeEventListener('keydown',escH); } });
  fs._iv=setInterval(upd,500);
}

let growthCardId=null;
function openGrowthCard(i){
  growthCardId=i;
  const cls=CLASSES[currentClass]; const s=cls.students[i];
  const lvl = s.score>=20?3 : s.score>=14?2 : s.score>=8?1 : 0;
  const NODES=['蛋','幼体','成体','进化'];
  const tl=NODES.map((nm,k)=>{
    const done=k<=lvl, cur=k===lvl;
    const line = k<NODES.length-1 ? `<div class="tline ${k<lvl?'done':''}"></div>`:'';
    return `<div class="tnode ${done?'done':''} ${cur?'cur':''}"><div class="dot">${done?'✓':k+1}</div><div class="tl">${nm}</div></div>${line}`;
  }).join('');

  const DECORS=[['sprout','🌱','嫩芽发夹',1],['magnifier','🔍','放大镜',1],['bow','🎀','蝴蝶结',1],['scarf','🧣','小围巾',2],['hat','🎩','探险帽',2],['glasses','👓','星星眼镜',2],['crown','👑','小皇冠',3],['cape','🌈','彩虹披风',3]];
  const decorHtml=DECORS.map(([key,em,nm,req])=>{
    const ok = s.score>= (req===1?6:req===2?12:18);
    const worn = s.wearing===key;
    return `<div class="ditem ${ok?'':'lock'} ${worn?'wearing':''}" data-wear="${key}"><div class="di">${em}</div><div class="dn">${nm}</div>${ok?`<button class="wear-btn">${worn?'卸下':'穿戴'}</button>`:''}</div>`;
  }).join('');

  const connected=s.vines.map(j=>cls.students[j]).filter(Boolean);
  let netSvg='';
  if(connected.length){
    const R=64, cx=80, cy=80;
    let lines='', dots='';
    connected.forEach((c,k)=>{
      const ang=(-90 + k*360/connected.length)*Math.PI/180;
      const x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
      lines+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#9BD9A8" stroke-width="3"/>`;
      dots+=`<circle cx="${x}" cy="${y}" r="20" fill="${c.color}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#5A5566">${c.n[0]}</text>`;
    });
    netSvg=`<svg class="netsvg" width="160" height="160" viewBox="0 0 160 160">
      ${lines}
      <circle cx="${cx}" cy="${cy}" r="24" fill="${s.color}"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" font-weight="900" fill="#5A5566">${s.n[0]}</text>
      ${dots}</svg>`;
  }else{
    netSvg=`<svg class="netsvg" width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="26" fill="${s.color}"/><text x="80" y="85" text-anchor="middle" font-size="13" font-weight="900" fill="#5A5566">${s.n[0]}</text></svg>`;
  }
  const netNote = connected.length
    ? `已与 <b>${connected.length}</b> 位伙伴连起藤蔓：<br>${connected.map(c=>esc(c.n)).join('、')}<br>合作越多，共生越繁荣 🌿`
    : `还没有连接藤蔓～<br>多用「小组合作 / 帮助同学」点评，<br>就能织出专属关系网 🌿`;

  const stColor={active:'#5AA0C8',wilt:'#B0A89C',loved:'#FF8FB0',injured:'#FF9E9E'}[s.state];
  const stTxt=stateText(s.state);

  // R34：学生自助互动明细（签到/答题/观察/作业），让老师的点评与成长值有依据
  const ACT_ICON={checkin:'🌞',quiz:'📚',observe:'🔍',homework:'📝'};
  const ACT_TXT={checkin:'每日签到',quiz:'课间答题',observe:'观察记录',homework:'提交作业'};
  const acts=(s.acts||[]);
  const actsHtml = acts.length ? acts.map(a=>{
    const t=a.created_at?new Date(a.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    const ex=a.kind==='quiz'?(a.correct?'（答对）':'（答错）'):'';
    return `<div class="actrow"><span class="ai">${ACT_ICON[a.kind]||'⭐'}</span><span class="at">${ACT_TXT[a.kind]||esc(a.kind)}${ex}${a.detail?('：'+esc(a.detail)):''}</span><span class="ap">+${a.points}</span><span class="ad">${t}</span></div>`;
  }).join('') : '<div class="empty">暂无自主互动记录（学生在学生端签到 / 答题 / 观察 / 提交作业后出现）</div>';

  $('growthCard').innerHTML=`
    <div class="ghead">
      <div class="gava" style="--c:${s.color}">${creature(s.type,s.color)}</div>
      <div><div class="gn">${esc(s.n)}</div>
        <div class="gm">${cls.name} · 小队 ${GROUPS[i%4]} · ${cls.theme}</div>
        <div class="gstate" style="background:${stColor}22;color:${stColor}">${stTxt} · ${s.score} 生态值</div>
      </div>
    </div>
    <div class="sec"><div class="sect">🌟 进化时间轴</div><div class="timeline">${tl}</div></div>
    <div class="sec"><div class="sect">🎀 预置装扮（收集驱动）</div><div class="decor">${decorHtml}</div></div>
    <div class="sec"><div class="sect">🌿 关系藤蔓网</div><div class="netcard">${netSvg}<div class="netnote">${netNote}</div></div></div>
    <div class="sec"><div class="sect">📋 互动明细（学生自助）</div><div class="actlist">${actsHtml}</div></div>
  `;
  $('overlay').classList.add('show');
  // 装扮穿戴/卸下绑定
  document.querySelectorAll('#growthCard .ditem[data-wear]').forEach(el=>{
    el.onclick=()=>{
      const key=el.dataset.wear;
      const s2=CLASSES[currentClass].students[growthCardId];
      if(s2.wearing===key){ s2.wearing=null; toast('已卸下装扮'); }
      else{ s2.wearing=key; toast('已穿戴：'+(DECORS.find(d=>d[0]===key)||[])[2]||'装扮'); }
      saveClass(currentClass);
      openGrowthCard(growthCardId); // 刷新卡片
      renderPlanet(); // 刷新星球上的穿戴效果
    };
  });
}

  const ok=()=>toast('已复制入班链接 🔗');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok).catch(()=>legacyCopy(url,ok));
  } else legacyCopy(url,ok);
}
function legacyCopy(txt,done){
  try{
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.cssText='position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done();
  }catch(e){ toast('复制失败，请手动复制：'+txt); }
}

function renameStudent(i, name){
  name=name.trim();
  if(!name){ renderRoster(); return; }
  const cls=CLASSES[currentClass];
  if(!cls.students[i]) return;
  if(cls.students[i].n===name) return;
  if(cloudSync()){
    const sid=remoteStudentId(i);

      GP.api('/api/students/'+sid,{method:'PUT',body:JSON.stringify({name})})
        .then(()=>refreshFromCloud())
        .then(()=>toast('已改名为 '+name+' ✏️'))
        .catch(err=>cloudFail(err,'改名未同步'));
      return;
    }

function addStudent(name){
  name=name.trim();
  if(!name) return;
  const cls=CLASSES[currentClass];
  if(cls.students.some(s=>s.n===name)){ toast('已存在同名伙伴'); return; }
  if(cloudSync()){
    GP.api('/api/classes/'+remoteClassId()+'/students',{method:'POST',body:JSON.stringify({names:[name]})})
      .then(()=>refreshFromCloud())
      .then(()=>toast('已添加 '+name+' 🌱'))
      .catch(err=>cloudFail(err,'添加未同步'));
    return;
  }
  cls.students.push(spawnPartner(name, cls.students.length));

function deleteStudent(i){
  const cls=CLASSES[currentClass];
  if(!cls.students[i]) return;
  const name=cls.students[i].n;
  if(!confirm(`确定删除「${name}」吗？\nTA 的伙伴与藤蔓、点评等数据会一起移除。`)) return;
  if(cloudSync()){
    const sid=remoteStudentId(i);
    if(sid){
      const headers={};
      if(GP.lessonActive()) headers['X-Lesson-Token']=GP.lessonToken;
      GP.api('/api/students/'+sid,{method:'DELETE',headers})
        .then(()=>refreshFromCloud())
        .then(()=>toast('已删除 '+name+' 🗑'))
        .catch(err=>cloudFail(err,'删除未同步'));
      return;
    }
  }
  cls.students.splice(i,1);
  cls.students.forEach(s=>{ s.vines=s.vines.filter(v=>v!==i).map(v=> v>i? v-1 : v); });
  if(selectedId===i){ selectedId=null; }
  else if(selectedId!==null && selectedId>i){ selectedId--; }
  if(growthCardId===i){ closeGrowth(); }
  commitRoster();
  toast(`已删除 ${name} 🗑`);
}
function importBatch(){
  const txt=$('importArea').value||'';
  const names=txt.split(/[\n,，、\s]+/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){ $('importHint').textContent='没有识别到名字～'; return; }
  if(cloudSync()){
    const seen=new Set(CLASSES[currentClass].students.map(s=>s.n));
    const fresh=names.filter(n=>!seen.has(n));
    if(!fresh.length){ $('importHint').textContent='这些名字都已在本班，无需重复导入'; return; }
    $('importHint').textContent='正在导入 '+fresh.length+' 位…';
    // 注意：新增与刷新分开处理——新增成功但 /state 刷新失败时，不能报成"导入失败"误导老师
    GP.api('/api/classes/'+remoteClassId()+'/students',{method:'POST',body:JSON.stringify({names:fresh})})
      .then(()=>refreshFromCloud()
        .then(()=>{ $('importHint').textContent='已导入 '+fresh.length+' 位（已同步云端）'; $('importArea').value=''; })
        .catch(()=>{ $('importHint').textContent='已导入 '+fresh.length+' 位，但花名册刷新超时，请手动刷新页面'; $('importArea').value=''; }))
      .catch(err=>{ $('importHint').textContent='导入失败：'+((err&&err.message)||'未知错误'); });
    return;
  }
  const cls=CLASSES[currentClass];
  const seen2=new Set(cls.students.map(s=>s.n));
  let added=0;
  names.forEach(nm=>{ if(!seen2.has(nm)){ cls.students.push(spawnPartner(nm, cls.students.length)); seen2.add(nm); added++; } });
  const dup=names.length-added;
  $('importHint').textContent=`已导入 ${added} 位`+(dup?`（跳过 ${dup} 个重复/空）`:'');
  $('importArea').value='';
  commitRoster();
}

  renderRoster();

let GP_recLabels = [];
function GP_clearRecommendedLabels(){

}
const GP={
  token:'',
  teacher:null,
  clsMap:{},
  lessonToken:'',   // R49 授课会话令牌
  lessonPin:'',     // R50 切班 PIN
  ready:false,
  enabled(){ return GP_CLOUD && !!this.token; },

  lessonActive(){ return !!this.lessonToken && !!remoteClassId(); },

  async startLesson(){
    const cid=remoteClassId();
    if(!cid){ toast('当前班级未同步到云端，请先登录'); return; }
    if(!this.enabled()){ toast('请先登录'); return; }
    try{
      const data=await this.api('/api/classes/'+cid+'/lesson/start',{method:'POST'});
      this.lessonToken=data.lesson_token||data.session_id||'';
      this.lessonPin=data.pin||'';
      try{sessionStorage.removeItem('gp_unlocked');}catch(e){}  // 新课重新上锁
      this.renderLessonUI();
      toast('📚 已开始上课 · PIN: '+this.lessonPin+'（切班需验证）');
      // R30: 拉取推荐标签并高亮 dock
      this.loadRecommendedLabels(cid);
    }catch(err){ toast('开始上课失败：'+(err.message||'未知错误')); }
  },

  async endLesson(){
    const cid=remoteClassId();
    if(!cid||!this.lessonToken){ this.lessonToken=''; this.lessonPin=''; this.renderLessonUI(); return; }
    try{
      await this.api('/api/classes/'+cid+'/lesson',{method:'DELETE',
        headers:{'X-Lesson-Token':this.lessonToken}});
      toast('📒 已下课');
    }catch(err){ /* 会话可能已过期，静默清理 */
      console.warn('[growth-planet] 下课清理：',err.message); }
    this.lessonToken=''; this.lessonPin='';
    try{sessionStorage.removeItem('gp_unlocked');}catch(e){}
    this.renderLessonUI();
    GP_clearRecommendedLabels(); // R30: 清理高亮
  },

  renderLessonUI(){
    const btn=$('lessonBtn'), pill=$('lessonPill'), pinTxt=$('lessonPinTxt');
    if(!btn) return;
    if(this.lessonActive()){
      btn.textContent='📒 下课';
      btn.style.display=''; btn.classList.add('primary');
      if(pill){
        pill.style.display='flex';
        pill.title='🔒 授课锁定中（PIN 已隐藏，防投影泄露）';
        if(pinTxt){
          pinTxt.textContent='🔒 授课锁定中';
          pill.style.cursor='default';
          pill.onclick=null; // 默认不响应点击，防学生点开看 PIN
        }
      }
    }else{
      btn.textContent='📚 开始上课';
      btn.style.display = GP_CLOUD?'':'none';
      btn.classList.remove('primary');
      if(pill) pill.style.display='none';
    }
  },

  async api(path,opt={}){
    // 只在确实有 body 时才声明 Content-Type：Fastify 对「声明 application/json 却空 body」
    // 会直接 400（FST_ERR_CTP_EMPTY_JSON_BODY）——这正是「删除学生」报 Bad Request 的根因。
    const headers={};
    if(opt.body!==undefined && opt.body!==null) headers['Content-Type']='application/json';
    if(this.token) headers.Authorization='Bearer '+this.token;
    const controller=new AbortController();
    const to=setTimeout(()=>controller.abort(),opt.timeout||12000);
    try{
      const res=await fetch(GP_API+path,{...opt,signal:controller.signal,headers:{...headers,...(opt.headers||{})}});
      clearTimeout(to);
      if(res.status===401){ this.logout(); throw new Error('登录已失效，请重新登录'); }
      if(res.status===204) return null;
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error||('请求失败 '+res.status));
      return data;
    }catch(e){ clearTimeout(to); if(e.name==='AbortError') throw new Error('请求超时，请检查网络'); throw e; }
  },

  async login(email,password){
    const data=await this.api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});
    this.token=data.token; this.teacher=data.teacher;
    localStorage.setItem('gp_token',data.token);
    // 登录已成功；同步失败不应被当成登录失败
    try{ await this.pullAll(); }
    catch(e){ console.error('[growth-planet] 登录后同步失败：',e); toast('☁ 已登录，但云端数据拉取失败：'+(e.message||e)); }
  },

  async loadRecommendedLabels(cid){
    try{
      const data=await this.api('/api/classes/'+cid+'/recommended-labels');
      GP_recLabels = data.labels||[];
      GP_highlightRecommended();
    }catch(e){ console.warn('推荐标签拉取失败',e); }
  },

  logout(){
    this.token=''; this.teacher=null; this.ready=false;
    this.lessonToken=''; this.lessonPin='';
    localStorage.removeItem('gp_token');
    renderGPBtn();
  },

  async pullAll(){
    const data=await this.api('/api/classes');
    if(!data.classes.length){ toast('账号下还没有班级，请先在后台建班'); return; }
    const order=[], map={};
    for(const rc of data.classes){
      const lid='r'+rc.id.replace(/-/g,'').slice(0,8);
      order.push(lid);
      map[lid]={remoteId:rc.id,ids:[]};
      CLASSES[lid]={id:lid,name:rc.name,theme:rc.theme||'科学班生态',stagePct:0,eco:0,tidy:80,students:[],
        remoteId:rc.id, code:rc.class_code||''};
    }
    CLASS_ORDER.length=0; order.forEach(id=>CLASS_ORDER.push(id));
    Object.keys(CLASSES).forEach(k=>{ if(!map[k]) delete CLASSES[k]; });
    this.clsMap=map;
    for(const lid of order) await this.pullState(lid);
    this.ready=true;
    if(!CLASSES[currentClass]) currentClass=order[0];
    renderTopbar(); renderPlanet(); renderBoard(); renderDock(); updateSelPanel();
  },

  async pullState(localId){
    const m=this.clsMap[localId]; if(!m) return;
    const data=await this.api('/api/classes/'+m.remoteId+'/state');
    const c=CLASSES[localId];
    c.name=data.class.name; c.theme=data.class.theme||c.theme;
    c.eco=data.class.eco_value; c.stagePct=data.class.stage.progress; c.tidy=data.board.tidiness;
    const idx={}; data.students.forEach((s,i)=>{ idx[s.id]=i; });
    m.ids=data.students.map(s=>s.id);
    c.students=data.students.map((s,i)=>({
      n:s.nickname||s.name,
      type:s.partner_kind||'worm',
      color:s.color||PALETTE[i%PALETTE.length],
      state:s.hurt?'injured':(s.loved?'loved':(s.status==='droop'?'wilt':'active')),
      score:s.growth, ask:s.ask, acts:s.activities||[],
      vines:(data.vines||[]).filter(v=>v.a_id===s.id||v.b_id===s.id)
              .map(v=>idx[v.a_id===s.id?v.b_id:v.a_id]).filter(x=>x!==undefined),
      decor:[]
    }));
  },

  pushEvent(gi,ti){
    const m=this.clsMap[currentClass];
    const tag=TAG_GROUPS[gi].tags[ti];
    if(!this.enabled()||!m||!tag||!tag.key||selectedId===null) return;
    const sid=m.ids[selectedId]; if(!sid) return;
    // R52: 点评需授课会话令牌；未开始上课时仅本地动效，不调 API
    if(!this.lessonActive()){
      toast('💡 请先点「开始上课」再点评，确保数据可追溯');
      return;
    }
    this.api('/api/events',{method:'POST',
      headers:{'X-Lesson-Token':this.lessonToken},
      body:JSON.stringify({class_id:m.remoteId,student_id:sid,label_key:tag.key})})
      .then(()=>setTimeout(async()=>{
        await this.pullState(currentClass);
        renderPlanet(); renderTopbar(); renderBoard(); updateSelPanel();
        if(typeof measureCenters==='function') measureCenters();
        if(typeof renderVines==='function') renderVines();
        document.querySelectorAll('.partner').forEach(e=>e.classList.toggle('sel',+e.dataset.i===selectedId));
      },320))
      .catch(err=>{ toast('☁ 同步失败，已暂存在本机：'+err.message); renderGPBtn(); });
  }
};

/* =====================================================================
   精致解锁面板（替换原生 prompt）——暗色卡片式 PIN 输入
   用法：const ok = await GP.pinPrompt('切班需验证 PIN');
   ===================================================================== */
GP.pinPrompt = function(title){
  return new Promise(resolve=>{
    // 已有面板先清
    const old=document.getElementById('pinModal'); if(old) old.remove();
    const mask=document.createElement('div'); mask.id='pinModal';
    mask.className='overlay show';
    mask.innerHTML=`<div class="modal" style="position:relative;max-width:360px;background:#241f3a;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:26px 24px;box-shadow:0 18px 50px rgba(0,0,0,.5)">
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:30px;margin-bottom:6px">🔒</div>
        <div style="font-size:15px;font-weight:900;color:#F4EFE7">${title||'请输入 PIN'}</div>
        <div style="font-size:11px;color:#9A94A6;margin-top:4px">仅老师操作</div>
      </div>
      <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autofocus
        style="width:100%;text-align:center;letter-spacing:8px;font-size:24px;font-weight:900;color:#F4EFE7;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;outline:none">
      <div id="pinErr" style="text-align:center;color:#E4798A;font-size:12px;min-height:18px;margin-top:8px"></div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button id="pinCancel" style="flex:1;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#9A94A6;font-weight:800;cursor:pointer">取消</button>
        <button id="pinOk" style="flex:1;padding:11px;border-radius:12px;border:0;background:#A8E6CF;color:#3E6B52;font-weight:900;cursor:pointer">解锁</button>
      </div>
    </div>`;
    document.body.appendChild(mask);
    const inp=mask.querySelector('#pinInput'), errBox=mask.querySelector('#pinErr');
    const close=(val)=>{ mask.remove(); document.removeEventListener('keydown',onKey); resolve(val); };
    const submit=()=>{ const v=inp.value.trim(); if(!v){ errBox.textContent='请输入 PIN'; inp.focus(); return; } close(v); };
    mask.querySelector('#pinOk').onclick=submit;
    mask.querySelector('#pinCancel').onclick=()=>close(null);
    mask.onclick=e=>{ if(e.target===mask) close(null); };
    const onKey=e=>{ if(e.key==='Enter') submit(); else if(e.key==='Escape') close(null); };
    document.addEventListener('keydown',onKey);
    setTimeout(()=>inp.focus(),50);
  });
};
GP.pinShake=function(){ const m=document.getElementById('pinModal'); if(!m) return; const inp=m.querySelector('#pinInput'); const err=m.querySelector('#pinErr'); if(inp){ inp.style.borderColor='#E4798A'; inp.value=''; inp.focus(); } if(err){ err.textContent='❌ PIN 不正确'; } const card=m.querySelector('.modal'); if(card){ card.classList.remove('pin-shake'); void card.offsetWidth; card.classList.add('pin-shake'); } };

// 轻量轮询：让学生自主互动（签到/答题/观察）实时反映到老师大屏
let _pollTimer=null, _polling=false;
function startPolling(){
  if(_pollTimer) return;            // 只启一个
  _pollTimer=setInterval(pollState, 15000);
  // 切到后台标签页时暂停，回到前台立即拉一次
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) return;
    if(GP&&GP.ready) pollState();
  });
}
async function pollState(){
  if(_polling||!GP||!GP.ready||!CLASSES[currentClass]) return;
  _polling=true;
  try{
    const before=CLASSES[currentClass].students.map(s=>s.score);
    await GP.pullState(currentClass);
    renderPlanet(); renderBoard(); renderTopbar(); updateSelPanel();
    const after=CLASSES[currentClass].students.map(s=>s.score);
    before.forEach((b,i)=>{
      if(after[i]!==b){                 // 生态值增加 → 伙伴快乐跳一跳
        const el=document.querySelector('.partner[data-i="'+i+'"] .crt');
        if(el){ el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); }
      }
    });
  }catch(e){ /* 网络抖动忽略，下次再试 */ }
  finally{ _polling=false; }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

  {key:'conclude',name:'完整表达结论'},
  {key:'safe_op',name:'规范操作实验'},
  {key:'safety_remind',name:'安全提醒'},
  {key:'observe',name:'认真观察记录'},
  {key:'reading',name:'科学阅读'},
  {key:'love_life',name:'爱护实验生物'},
  {key:'cooperate',name:'小组合作探究'},
  {key:'help_mate',name:'帮助同学'},
  {key:'engineering',name:'创新小制作'},
  {key:'tidy_up',name:'主动整理'},
  {key:'persist_observe',name:'坚持长期观察'}
];
let GP_selectedLabels = [];
function GP_renderLabelChips(){
  const box=$('qLabels'); if(!box) return;
  box.innerHTML=QUIZ_LABELS.map(l=>`<span class="qlabel-chip${GP_selectedLabels.includes(l.key)?' sel':''}" data-k="${l.key}" onclick="GP_toggleLabel('${l.key}')">${l.name}</span>`).join('');
}
function GP_toggleLabel(key){
  const i=GP_selectedLabels.indexOf(key);
  if(i>=0) GP_selectedLabels.splice(i,1); else GP_selectedLabels.push(key);
  GP_renderLabelChips();
}
function GP_addOption(){
  const c=$('qOptions'); if(!c) return;
  const idx=c.children.length;
  if(idx>=6){ toast('最多 6 个选项'); return; }
  const row=document.createElement('div');
  row.style.cssText='display:flex;align-items:center;gap:8px';
  row.innerHTML=`<input type="radio" name="qAnswer" value="${idx}" style="cursor:pointer">
    <input placeholder="选项 ${String.fromCharCode(65+idx)}" style="flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--glass);color:var(--txt)">
    <button class="btn" onclick="this.parentNode.remove()" style="padding:4px 8px">✕</button>`;
  c.appendChild(row);
}
/* 批量导入：解析「题干|A|B|C|D|答案」多行文本，逐条 POST 到题库 */
function GP_parseBatch(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const parsed=[];
  const errs=[];
  lines.forEach((ln,idx)=>{
    const parts=ln.split(/[|｜,，]/).map(p=>p.trim());
    if(parts.length<4){ errs.push(`第${idx+1}行：至少需要 题干+2选项+答案`); return; }
    const question=parts[0];
    const options=parts.slice(1,-1);
    const ansRaw=parts[parts.length-1].toUpperCase();
    const ansCode=ansRaw.charCodeAt(0);
    if(ansCode>=65 && ansCode<=90){ // A-Z
      const ansIdx=ansCode-65;
      if(ansIdx>=options.length){ errs.push(`第${idx+1}行：答案 ${ansRaw} 超出选项范围`); return; }
      parsed.push({question,options,answer:ansIdx});
    }else if(/^\d+$/.test(ansRaw)){
      const ansIdx=parseInt(ansRaw,10)-1;
      if(ansIdx>=options.length||ansIdx<0){ errs.push(`第${idx+1}行：答案序号 ${ansRaw} 无效`); return; }
      parsed.push({question,options,answer:ansIdx});
    }else{ errs.push(`第${idx+1}行：答案「${ansRaw}」需为 A/B/C/D 或数字`); }
  });
  return {parsed,errs};
}
function GP_batchFileLoad(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{ $('qBatchText').value=String(reader.result||'').trim(); toast('文件已载入，点击「导入题目」'); };
  reader.onerror=()=>toast('文件读取失败');
  reader.readAsText(file,'UTF-8');
}
async function GP_batchImport(){
  const text=$('qBatchText').value.trim();
  if(!text){ $('qBatchHint').textContent='请粘贴题目或上传文件'; return; }
  const {parsed,errs}=GP_parseBatch(text);
  if(!parsed.length){ $('qBatchHint').textContent='未解析到有效题目：'+errs[0]; return; }
  const cid=remoteClassId();
  const grade=$('qGrade').value?parseInt($('qGrade').value,10):null;
  const unit=$('qUnit').value.trim()||null;
  $('qBatchHint').textContent=`正在导入 ${parsed.length} 题…`;
  let ok=0, fail=0;
  for(let i=0;i<parsed.length;i++){
    const q=parsed[i];
    try{
      await GP.api('/api/classes/'+cid+'/questions',{method:'POST',
        body:JSON.stringify({grade,unit,question:q.question,options:q.options,answer:q.answer,explanation:'',recommended_labels:[]})});
      ok++;
    }catch(e){ fail++; }
  }
  let msg=`✅ 成功 ${ok} 题${fail?`，❌ 失败 ${fail} 题`:''}`;
  if(errs.length) msg+=`；${errs.length} 行格式有误已跳过`;
  $('qBatchHint').textContent=msg;
  if(ok>0){ $('qBatchText').value=''; GP_loadQuestions(); }
}
async function GP_saveQuestion(){
  const text=$('qText').value.trim();
  if(!text){ $('qHint').textContent='请输入题干'; return; }
  const opts=[];
  $('qOptions').querySelectorAll('input[type=text]').forEach(inp=>{
    if(inp.value.trim()) opts.push(inp.value.trim());
  });
  if(opts.length<2){ $('qHint').textContent='至少需要 2 个选项'; return; }
  const answerEl=document.querySelector('input[name=qAnswer]:checked');
  if(!answerEl){ $('qHint').textContent='请勾选正确答案'; return; }
  const answer=parseInt(answerEl.value,10);
  const grade=$('qGrade').value?parseInt($('qGrade').value,10):null;
  const unit=$('qUnit').value.trim()||null;
  const recommendedLabels=[...GP_selectedLabels]; // R30
  const cid=remoteClassId();
  $('qHint').textContent='保存中…';
  try{
    await GP.api('/api/classes/'+cid+'/questions',{method:'POST',
      body:JSON.stringify({grade,unit,question:text,options:opts,answer,explanation:'',recommended_labels:recommendedLabels})});
    $('qHint').textContent='✅ 已保存'; $('qText').value='';
    $('qOptions').innerHTML=''; GP_addOption(); GP_addOption();
    GP_selectedLabels=[]; GP_renderLabelChips(); // 清空标签
    GP_loadQuestions();
  }catch(err){ $('qHint').textContent='保存失败：'+(err.message||'未知错误'); }
}
async function GP_loadQuestions(){
  const cid=remoteClassId(); if(!cid) return;
  const listEl=$('qList'); if(!listEl) return;
  try{
    const data=await GP.api('/api/classes/'+cid+'/questions');
    const qs=data.questions||[];
    if(!qs.length){ listEl.innerHTML='<div style="font-size:12px;color:var(--txt2)">还没有题目</div>'; return; }
    listEl.innerHTML=qs.map(q=>`
      <div style="padding:8px;border-radius:8px;background:var(--glass);margin-bottom:6px">
        <div style="font-size:13px">${escHtml(q.question)}</div>
        <div style="font-size:11px;color:var(--txt2);margin-top:4px">
          ${opts(q.options,q.answer)}
          <a style="color:var(--bad);cursor:pointer;margin-left:8px" onclick="GP_delQuestion('${q.id}')">删除</a>
        </div>
      </div>`).join('');
    function opts(arr,ans){ return arr.map((o,i)=>`<span style="color:${i===ans?'var(--good)':'var(--txt2)'}">${String.fromCharCode(65+i)}. ${escHtml(o)}</span>`).join(' · '); }
  }catch(err){ listEl.innerHTML='<div style="font-size:12px;color:var(--bad)">加载失败</div>'; }
}
async function GP_delQuestion(qid){
  if(!confirm('确定删除这道题？')) return;
  try{
    await GP.api('/api/questions/'+qid,{method:'DELETE'});
    GP_loadQuestions();
    toast('已删除题目 🗑');
  }catch(err){ toast('删除失败：'+(err.message||'')); }
}

/* R46 换伙伴审批 */
async function openPartnerRequests(){
  if(!GP.enabled()){ toast('请先登录'); return; }
  let box=$('partnerReqPanel');
  if(!box){
    box=document.createElement('div'); box.id='partnerReqPanel';
    box.className='overlay';
    box.innerHTML=`<div class="modal" style="position:relative;max-width:420px">
      <button class="close" onclick="document.getElementById('partnerReqPanel').classList.remove('show')">×</button>
      <h2>🔄 换伙伴审批</h2>
      <div style="font-size:12px;color:var(--txt2);margin-bottom:12px">学生提交的换伙伴申请</div>
      <div id="prList" style="max-height:360px;overflow-y:auto"></div>
    </div>`;
    document.body.appendChild(box);
    box.onclick=e=>{ if(e.target===box) box.classList.remove('show'); };
  }
  box.classList.add('show');
  GP_loadPartnerRequests();
}
async function GP_loadPartnerRequests(){
  const cid=remoteClassId(); if(!cid) return;
  const el=$('prList'); if(!el) return;
  el.innerHTML='<div style="color:var(--txt2)">加载中…</div>';
  try{
    const data=await GP.api('/api/classes/'+cid+'/partner-requests');
    const reqs=data.requests||[];
    if(!reqs.length){ el.innerHTML='<div style="font-size:13px;color:var(--txt2)">暂无待审批申请</div>'; return; }
    const KIND_CN={worm:'萌系',fish:'游系',sprout:'植系',crystal:'晶系',butterfly:'蝶系'};
    el.innerHTML=reqs.map(r=>`
      <div style="padding:10px;border-radius:10px;background:var(--glass);margin-bottom:8px">
        <div style="font-size:13px;font-weight:800">${escHtml(r.student_name||'未知学生')}</div>
        <div style="font-size:12px;color:var(--txt2);margin-top:4px">
          ${KIND_CN[r.current_kind]||r.current_kind||'—'} → ${KIND_CN[r.requested_kind]||r.requested_kind||'—'}
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn primary" onclick="GP_resolvePartner('${r.id}','approve')" style="font-size:12px;padding:5px 12px">✅ 批准</button>
          <button class="btn" onclick="GP_resolvePartner('${r.id}','deny')" style="font-size:12px;padding:5px 12px">❌ 拒绝</button>
        </div>
      </div>`).join('');
  }catch(err){ el.innerHTML='<div style="color:var(--bad)">加载失败：'+escHtml(err.message||'')+'</div>'; }
}
async function GP_resolvePartner(reqId,action){
  const cid=remoteClassId(); if(!cid) return;
  try{
    await GP.api('/api/classes/'+cid+'/partner-requests/'+reqId,{method:'POST',
      body:JSON.stringify({action})});
    toast(action==='approve'?'已批准换伙伴 ✅':'已拒绝 ❌');
    GP_loadPartnerRequests();
  }catch(err){ toast('操作失败：'+(err.message||'')); }
}

/* 花名册打开时自动刷新换伙伴申请数量 */
async function GP_checkPartnerRequests(){
  if(!GP.enabled()||!remoteClassId()) return;
  try{
    const data=await GP.api('/api/classes/'+remoteClassId()+'/partner-requests');
    const n=(data.requests||[]).length;
    const badge=$('partnerReqBadge');
    if(badge){ badge.style.display=n?'':'none'; badge.textContent=n?('待审批 '+n):''; }
  }catch(e){ /* 忽略 */ }
}
