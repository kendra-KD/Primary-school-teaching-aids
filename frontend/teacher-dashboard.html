<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>成长星球 · 科学班生态</title>
<script>window.GP_API_BASE = '__GP_API_BASE__';</script>
<style>
:root{
  --bg1:#1b1636; --bg2:#241a47; --bg3:#15263f;
  --glass:rgba(255,255,255,.07);
  --glass-strong:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.14);
  --txt:#ECE9F7; --txt2:#A89FCB; --txt3:#7C729E;
  --accent:#8be9d4; --accent2:#b58cff; --accent3:#ff9ec9;
  --good:#7FD1B4; --warn:#FFD6A5; --bad:#FF9E9E;
  --r:22px;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  color:var(--txt);
  background:
    radial-gradient(1200px 800px at 12% -10%, rgba(181,140,255,.22), transparent 60%),
    radial-gradient(1000px 700px at 100% 0%, rgba(139,233,212,.18), transparent 55%),
    radial-gradient(900px 900px at 60% 120%, rgba(255,158,201,.16), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-attachment:fixed;
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 柔和星点 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,.5), transparent);
}
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:18px 18px 120px;}

/* ===== 顶部栏 ===== */
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;box-shadow:0 10px 40px rgba(0,0,0,.28);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.5px;}
.brand .logo{width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#8be9d4 40%,#5fae9f 80%);
  box-shadow:0 0 16px rgba(139,233,212,.6);}
.chips{display:flex;gap:8px;flex:1;flex-wrap:wrap;}
.chip{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:14px;cursor:pointer;
  background:var(--glass);border:1px solid transparent;transition:.2s;min-width:0;
}
.chip:hover{background:var(--glass-strong);}
.chip.active{border-color:var(--accent);box-shadow:0 0 14px rgba(139,233,212,.35);}
.chip .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor;}
.chip .ct{font-weight:800;font-size:13px;white-space:nowrap;}
.chip .cs{font-size:11px;color:var(--txt2);white-space:nowrap;}
.spacer{flex:1;}
.stage-pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:var(--glass);}
.stage-pill b{font-size:14px;}
.timer{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:14px;padding:6px 10px;}
.timer .clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:16px;min-width:54px;text-align:center;}
.timer button{font:inherit;font-weight:800;font-size:12px;color:var(--txt);background:var(--glass-strong);
  border:1px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer;transition:.15s;}
.timer button:hover{background:rgba(255,255,255,.2);}

/* ===== 主区 ===== */
.main{display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:18px;}
@media(max-width:900px){.main{grid-template-columns:1fr;}}

/* 星球面板 */
.planet-wrap{
  position:relative;border-radius:28px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(181,140,255,.18), transparent 60%),
    radial-gradient(100% 80% at 50% 100%, rgba(139,233,212,.14), transparent 60%),
    var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(14px);
  box-shadow:0 18px 60px rgba(0,0,0,.32), inset 0 0 60px rgba(139,233,212,.06);
  padding:18px;
}
.planet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.planet-title{display:flex;align-items:center;gap:12px;}
.planet-title .big{width:64px;height:64px;filter:drop-shadow(0 0 10px var(--accent));}
.planet-title .stage{font-size:20px;font-weight:900;}
.planet-title .sub{font-size:12px;color:var(--txt2);}
.planet-stats{display:flex;gap:10px;align-items:center;}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;min-width:78px;}
.stat .v{font-size:20px;font-weight:900;}
.stat .k{font-size:11px;color:var(--txt2);}
.ring{position:relative;width:64px;height:64px;}
.ring svg{position:absolute;inset:0;}

.planet{position:relative;min-height:420px;border-radius:22px;
  background:radial-gradient(circle at 50% 45%, rgba(181,140,255,.10), transparent 70%);}
#vines{position:absolute;inset:0;pointer-events:none;z-index:3;}
#planetGrid{position:relative;z-index:2;display:grid;gap:14px;padding:8px;}
.partner{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:12px 8px 10px;border-radius:18px;cursor:pointer;
  background:var(--glass);border:1px solid transparent;transition:transform .18s,box-shadow .18s,background .18s;
  animation:float 5s ease-in-out infinite;
}
.partner:nth-child(2n){animation-delay:-1.2s;}
.partner:nth-child(3n){animation-delay:-2.4s;}
.partner:hover{transform:translateY(-3px);background:var(--glass-strong);}
.partner.sel{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-3px) scale(1.03);}
.partner .score{position:absolute;top:8px;right:10px;font-size:12px;font-weight:900;color:var(--c);
  background:rgba(0,0,0,.25);border-radius:10px;padding:1px 7px;}
.partner .blob{width:74px;height:74px;position:relative;display:grid;place-items:center;
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 60%,transparent));}
.partner .blob svg{width:100%;height:100%;}
.partner .blob.glow{animation:pop .9s ease;}
.partner .fx{position:absolute;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:1px;padding-top:2px;}
.partner .fx span{width:13px;height:13px;opacity:.95;}
.partner .name{font-size:13px;font-weight:800;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.partner .grp{font-size:10px;color:var(--txt2);}
.partner .badge{position:absolute;top:8px;left:8px;font-size:14px;}
.partner .carepill{position:absolute;bottom:-6px;font-size:10px;font-weight:800;color:#fff;background:var(--bad);
  border-radius:8px;padding:1px 6px;box-shadow:0 0 10px var(--bad);}
.partner.wilt{filter:grayscale(.5) brightness(.8);}
.partner.injured .blob{animation:shake .5s;}
.partner.loved{box-shadow:0 0 18px rgba(255,158,201,.5);}
.partner .spark{position:absolute;top:6px;font-size:20px;animation:rise .9s ease forwards;pointer-events:none;}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 侧栏 */
.side{display:flex;flex-direction:column;gap:16px;}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
.panel h3{font-size:14px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--txt);}
.selcard{display:flex;align-items:center;gap:12px;min-height:64px;
  background:var(--glass);border:1px dashed var(--line);border-radius:16px;padding:10px 12px;color:var(--txt2);font-size:13px;}
.selcard:not(.empty){color:var(--txt);border-style:solid;}
.selcard .selava{width:48px;height:48px;flex:none;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 60%,transparent));}
.selcard .selava svg{width:100%;height:100%;}
.selcard .sn{font-weight:900;font-size:15px;}
.selcard .ss{font-size:11px;color:var(--txt2);}
.sel-actions{display:flex;gap:8px;margin-top:10px;}
.btn{font:inherit;font-weight:800;font-size:13px;border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;cursor:pointer;color:var(--txt);background:var(--glass-strong);transition:.15s;}
.btn:hover{background:rgba(255,255,255,.2);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1b1536;border:none;box-shadow:0 6px 18px rgba(139,233,212,.35);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.board{display:flex;flex-direction:column;gap:8px;}
.bcard{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--glass);}
.bcard .medal{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;}
.bcard .bmain{flex:1;min-width:0;}
.bcard .bt{font-size:11px;color:var(--txt2);}
.bcard .bn{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bcard .bv{font-size:11px;color:var(--accent);font-weight:800;white-space:nowrap;}

/* ===== 点评 Dock ===== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px 14px;
  background:linear-gradient(0deg,rgba(20,15,40,.92),rgba(20,15,40,.55) 70%,transparent);
  backdrop-filter:blur(6px);}
.dock-inner{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.gt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--txt2);min-width:64px;}
.gt .gd{width:9px;height:9px;border-radius:50%;background:var(--gc);box-shadow:0 0 8px var(--gc);}
.chips-tags{display:flex;gap:7px;flex-wrap:wrap;}
.tag{font:inherit;font-weight:800;font-size:12px;cursor:pointer;border-radius:12px;padding:7px 11px;
  color:var(--txt);background:color-mix(in srgb,var(--gc) 22%,var(--glass-strong));
  border:1px solid color-mix(in srgb,var(--gc) 45%,transparent);transition:.15s;}
.tag:hover{transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--gc) 40%,transparent);}
.tag .v{opacity:.8;margin-left:3px;font-size:11px;}
.tag.neg{background:rgba(255,158,158,.16);border-color:rgba(255,158,158,.5);color:#ffc9c9;}

/* ===== 浮层通用 ===== */
.overlay{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(15,10,30,.55);backdrop-filter:blur(4px);padding:18px;}
.overlay.show{display:flex;}
.modal{width:min(560px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#241a47,#1b1636);
  border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.5);}
.modal .close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--glass);color:var(--txt);font-size:18px;cursor:pointer;}
.modal h2{font-size:17px;font-weight:900;margin-bottom:14px;}
/* 花名册 */
.roster-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.roster-tools input,.modal input{font:inherit;font-size:13px;padding:9px 11px;border-radius:12px;border:1px solid var(--line);
  background:var(--glass);color:var(--txt);outline:none;}
.roster-tools input{flex:1;min-width:120px;}
.ritem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--glass);margin-bottom:8px;}
.ritem .ravi{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 60%,transparent));}
.ritem input{flex:1;min-width:0;}
.rdel{font:inherit;font-weight:800;font-size:12px;border:1px solid rgba(255,158,158,.5);background:rgba(255,158,158,.14);
  color:#ffc9c9;border-radius:10px;padding:7px 10px;cursor:pointer;}
.import-note{font-size:12px;color:var(--txt2);margin-top:8px;white-space:pre-line;}

/* 成长卡 */
.ghead{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.gava{width:64px;height:64px;flex:none;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 60%,transparent));}
.gn{font-size:18px;font-weight:900;}
.gm{font-size:12px;color:var(--txt2);}
.gstate{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:10px;}
.sec{margin-bottom:14px;}
.sect{font-size:13px;font-weight:900;margin-bottom:8px;color:var(--accent);}
.timeline{display:flex;align-items:flex-start;gap:0;}
.tnode{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.tnode .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;
  background:var(--glass);border:2px solid var(--line);color:var(--txt2);z-index:2;}
.tnode.done .dot{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1b1536;border:none;}
.tnode.cur .dot{box-shadow:0 0 14px var(--accent);}
.tnode .tl{font-size:11px;margin-top:5px;color:var(--txt2);}
.tline{position:absolute;top:15px;left:50%;width:100%;height:3px;background:var(--line);z-index:1;}
.tline.done{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.decor{display:flex;gap:8px;flex-wrap:wrap;}
.ditem{width:62px;height:74px;border-radius:14px;background:var(--glass);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:22px;}
.ditem .dn{font-size:10px;color:var(--txt2);}
.ditem.lock{opacity:.4;filter:grayscale(1);}
.netcard{display:flex;gap:14px;align-items:center;}
.netsvg{flex:none;}
.netnote{font-size:12px;color:var(--txt2);line-height:1.6;}

/* Toast */
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-20px);z-index:120;
  background:rgba(20,15,40,.92);border:1px solid var(--line);color:var(--txt);font-weight:800;font-size:13px;
  padding:10px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.4);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 登录按钮（动态创建） */
hidden{display:none!important;}
</style>
</head>
<body>
<div class="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand"><span class="logo"></span>成长星球</div>
    <div class="chips" id="classChips"></div>
    <div class="stage-pill">阶段 <b id="stageTxt">—</b></div>
    <div class="timer">
      <span class="clock" id="timerTxt">00:00</span>
      <button id="tStart">开始</button>
      <button id="tReset">重置</button>
    </div>
    <button class="btn" id="gearBtn">⚙ 花名册</button>
  </header>

  <!-- 主区 -->
  <div class="main">
    <section class="planet-wrap">
      <div class="planet-head">
        <div class="planet-title">
          <div class="ring" id="bigRing"></div>
          <div>
            <div class="stage" id="bigStage">—</div>
            <div class="sub" id="bigSub">—</div>
          </div>
        </div>
        <div class="planet-stats">
          <div class="stat"><div class="v" id="ecoTxt">0</div><div class="k">生态值</div></div>
          <div class="stat"><div class="v" id="ringPct">0%</div><div class="k" id="ringSub">—</div></div>
        </div>
      </div>
      <div class="planet" id="planet">
        <svg id="vines"></svg>
        <div id="planetGrid"></div>
      </div>
    </section>

    <aside class="side">
      <div class="panel">
        <h3>🌟 当前点评对象</h3>
        <div class="selcard empty" id="selCard">👆 先点一个伙伴</div>
        <div class="sel-actions">
          <button class="btn primary" id="openCard" disabled>查看成长卡</button>
          <button class="btn" id="clearSel" disabled>取消选择</button>
        </div>
      </div>
      <div class="panel">
        <h3>🏆 光荣榜 · 共生榜</h3>
        <div class="board" id="boardList"></div>
      </div>
    </aside>
  </div>
</div>

<!-- 点评 Dock -->
<div class="dock">
  <div class="dock-inner">
    <div id="tagRow"></div>
  </div>
</div>

<!-- 花名册浮层 -->
<div class="overlay" id="roster">
  <div class="modal" style="position:relative">
    <button class="close" id="rosterClose">×</button>
    <h2>📒 花名册 · <span id="rosterClass"></span></h2>
    <div style="font-size:12px;color:var(--txt2);margin-bottom:10px" id="rosterCount"></div>
    <div class="roster-tools">
      <input id="addInput" placeholder="输入学生姓名，回车添加">
      <button class="btn primary" id="addBtn">＋ 添加</button>
    </div>
    <div class="roster-tools">
      <textarea id="importArea" placeholder="批量导入：每行一个名字，或用逗号/空格分隔" rows="2"
        style="font:inherit;font-size:13px;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--txt);outline:none;flex:1;min-width:200px;resize:vertical"></textarea>
      <button class="btn" id="importBtn">批量导入</button>
    </div>
    <div class="import-note" id="importHint"></div>
    <div id="rosterList" style="margin-top:12px"></div>
  </div>
</div>

<!-- 成长卡浮层 -->
<div class="overlay" id="overlay">
  <div class="modal" style="position:relative">
    <button class="close" onclick="closeGrowth()">×</button>
    <div id="growthCard"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =====================================================================
   数据层：多班级 + 严格隔离
   ===================================================================== */
const PALETTE=['#FFB3C6','#A8E6CF','#FFE5A0','#A0D2FF','#CDB4FF','#FFD6A5','#B5EAD7','#C7CEEA','#FFC9DE','#A0E7E5','#D5AAFF','#9BF6FF','#FFAFA3','#BDEBFF'];
const GROUPS=['🌱萌芽组','🔬探秘组','💡奇思组','🛡️守护组'];
const GROUP_COLORS=['#A8E6CF','#A0D2FF','#FFE5A0','#CDB4FF'];

function mk(n,type,color,state,score,ask,vines){
  return {n,type,color,state:state||'active',score:score||8,ask:ask||0,vines:vines||[],decor:[]};
}
const CLASSES={
  c1:{
    id:'c1', name:'三(1)班', theme:'春蚕工坊', stagePct:0.55, eco:42, tidy:82,
    students:[
      mk('王梓萱','worm',PALETTE[0],'active',14,2), mk('李一鸣','worm',PALETTE[1],'active',9,1,[1]),
      mk('张可欣','worm',PALETTE[2],'active',11,0), mk('刘子涵','worm',PALETTE[3],'wilt',5,0),
      mk('陈思源','worm',PALETTE[4],'active',13,4,[0,1]), mk('赵雨桐','worm',PALETTE[5],'active',8,1),
      mk('黄俊熙','worm',PALETTE[6],'active',10,0), mk('周梦琪','worm',PALETTE[7],'loved',16,1),
      mk('吴浩宇','worm',PALETTE[8],'active',7,0), mk('郑雅婷','worm',PALETTE[9],'active',12,2),
      mk('孙悦宁','worm',PALETTE[10],'active',9,0), mk('胡天磊','worm',PALETTE[11],'injured',4,0),
      mk('朱晨曦','worm',PALETTE[12],'active',15,3), mk('高若汐','worm',PALETTE[13],'active',8,1),
    ]
  },
  c2:{
    id:'c2', name:'四(2)班', theme:'种子方舟', stagePct:0.20, eco:18, tidy:70,

function decorSVG(kind){
  if(kind==='leaf') return `<svg viewBox="0 0 24 24"><path d="M12 22 C4 16 4 6 12 2 C20 6 20 16 12 22Z" fill="#8fd18f" stroke="#5fae5f" stroke-width="1"/><line x1="12" y1="22" x2="12" y2="8" stroke="#5fae5f" stroke-width="1"/></svg>`;
  if(kind==='know') return `<svg viewBox="0 0 24 24"><path d="M12 22 C5 16 5 7 12 3 C19 7 19 16 12 22Z" fill="#FFE5A0" stroke="#E0B84a" stroke-width="1"/><line x1="12" y1="20" x2="12" y2="7" stroke="#E0B84a" stroke-width="1"/></svg>`;
  return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#FFB3C6"/><g fill="#FF8FB0"><circle cx="12" cy="4" r="3"/><circle cx="12" cy="20" r="3"/><circle cx="4" cy="12" r="3"/><circle cx="20" cy="12" r="3"/></g><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg>`;
}

/* =====================================================================
   音效（Web Audio 简单"叮"）
   ===================================================================== */
let actx=null;
function ding(kind){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    let f=523.25, dur=.6, type='sine';
    if(kind==='bloom'){f=880;dur=.7;}
    else if(kind==='evolve'){f=660;dur=.8;type='triangle';}
    else if(kind==='love'){f=784;dur=.7;}
    else if(kind==='neg'){f=233;dur=.5;type='sine';}
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.22,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}

function ringSVG(pct,size,color){
  const r=(size-12)/2, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+5}" text-anchor="middle" font-size="${size*0.30}" font-weight="900" fill="${color}">${Math.round(pct*100)}%</text>
  </svg>`;
}
function stageInfo(pct){
  if(pct<0.34) return {name:'荒芜星球',color:'#C9B8A8',short:'荒芜',sub:'播下第一颗种子吧'};
  if(pct<0.70) return {name:'绿意星球',color:'#7FD1B4',short:'绿意',sub:'绿芽正在舒展～'};
  return {name:'繁荣星球',color:'#FF9EC4',short:'繁荣',sub:'生态欣欣向荣！'};
}

function renderBoard(){
  const cls=CLASSES[currentClass]; const S=cls.students;
  const grpScore=[0,0,0,0];
  S.forEach((s,i)=>grpScore[i%4]+=s.score);
  let bestG=0; grpScore.forEach((v,i)=>{if(v>grpScore[bestG])bestG=i;});
  let bestPair=null,bestN=0;
  for(let i=0;i<S.length;i++)for(const j of S[i].vines){ if(j>i){const n=pairVines(i,j); if(n>bestN){bestN=n;bestPair=[i,j];}} }
  function pairVines(a,b){return (S[a].vines.includes(b)?1:0)+(S[b].vines.includes(a)?1:0);}
  let askBest=0; S.forEach((s,i)=>{if(s.ask>askBest)askBest=i;});
  let loveBest=0,loveMax=-1; S.forEach((s,i)=>{const lv=(s.state==='loved'?1:0); if(lv>loveMax){loveMax=lv;loveBest=i;}});
  const tidyColor = cls.tidy>75?'#7FD1B4':cls.tidy>50?'#FFD6A5':'#FF9E9E';
  const cards=[
    {m:'🥇',c:'#FFE5A0',t:'最繁荣小组',n:GROUPS[bestG],v:`${grpScore[bestG]} 生态值`},
    {m:'🤝',c:'#A0D2FF',t:'最佳搭档',n:bestPair?`${esc(S[bestPair[0]].n)} & ${esc(S[bestPair[1]].n)}`:'期待第一次合作',v:`${bestN} 根藤蔓`},
    {m:'💡',c:'#CDB4FF',t:'最爱提问',n:esc(S[askBest].n),v:`${S[askBest].ask} 次好问题`},
    {m:'💗',c:'#FFB3C6',t:'生命守护星',n:esc(S[loveBest].n),v:loveMax>0?'温柔守护中':'一起爱护生命'},
    {m:'🧹',c:tidyColor,t:'星球整洁度',n:cls.tidy>75?'整洁如新':cls.tidy>50?'还算整洁':'该整理啦',v:`${cls.tidy}%`},
  ];
  $('boardList').innerHTML=cards.map(c=>`
    <div class="bcard">
      <div class="medal" style="background:${c.c}33">${c.m}</div>
      <div class="bmain"><div class="bt">${c.t}</div><div class="bn">${c.n}</div></div>
      <div class="bv">${c.v}</div>
    </div>`).join('');
}

function selectPartner(i){

  document.querySelectorAll('.partner').forEach(el=>el.classList.toggle('sel',+el.dataset.i===i));
  updateSelPanel();
  ding('bloom');

function applyTag(gi,ti){
  if(selectedId===null){ toast('请先点一个伙伴 👆'); return; }
  const cls=CLASSES[currentClass]; const s=cls.students[selectedId];
  const tag=TAG_GROUPS[gi].tags[ti]; if(!tag) return;
  const eff=tag.effect;
  const el=document.querySelector(`.partner[data-i="${selectedId}"]`);
  const blob=el.querySelector('.blob');

  if(eff==='bloom'){ s.decor.push('flower'); s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.01*tag.v); ding('bloom'); flash(blob,'glow'); spawnSpark(el,'🌸'); }
  else if(eff==='evolve'){ s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.015*tag.v); el.classList.add('evolve'); setTimeout(()=>el.classList.remove('evolve'),800); ding('evolve'); spawnSpark(el,'✨'); if(ti===1||tag.label.includes('长期')) s.decor.push('leaf'); }
  else if(eff==='glow'){ s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.01*tag.v); flash(blob,'glow'); ding('glow'); }
  else if(eff==='leaf'){ s.decor.push('leaf'); s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.01*tag.v); ding('bloom'); spawnSpark(el,'🍃'); }
  else if(eff==='knowleaf'){ s.decor.push('know'); s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.008*tag.v); ding('bloom'); }
  else if(eff==='love'){ s.state='loved'; s.score+=tag.v; cls.eco+=tag.v; cls.stagePct=Math.min(1,cls.stagePct+0.012*tag.v); ding('love'); spawnSpark(el,'💗'); }
  else if(eff==='vine'){
    let target; do{ target=Math.floor(Math.random()*cls.students.length);}while(target===selectedId);
    if(!s.vines.includes(target)) s.vines.push(target);
    if(!cls.students[target].vines.includes(selectedId)) cls.students[target].vines.push(selectedId);
    s.score+=tag.v; cls.eco+=tag.v; flash(blob,'glow'); ding('glow'); renderVines();
  }
  else if(eff==='wilt'){ s.state='wilt'; ding('neg'); toast(`${s.n} 的伙伴蔫了，明天养回来就好 🌱`); }
  else if(eff==='injured'){ s.state='injured'; ding('neg'); toast(`${s.n} 的伙伴受伤了，请用"照料"动作恢复 💗`); }
  else if(eff==='tidy'){ cls.tidy=Math.max(0,cls.tidy-8); toast('星球整洁度下降，课后一起整理吧 🧹'); }

  if(eff!=='wilt'&&eff!=='injured'&&eff!=='tidy') s.ask = (TAG_GROUPS[gi].name==='思维'&&ti===0)? s.ask+1 : s.ask;

  saveClass(currentClass);
  renderPlanet(); selectedId=selectedId;
  document.querySelectorAll('.partner').forEach(e=>e.classList.toggle('sel',+e.dataset.i===selectedId));
  renderTopbar(); renderBoard(); updateSelPanel();
  toast(`${s.n} · ${tag.label} ${tag.v>0?'+'+tag.v:''} ✨`);
}

function flash(blob,clsName){blob.classList.add(clsName);setTimeout(()=>blob.classList.remove(clsName),900);}
function spawnSpark(el,emo){const s=document.createElement('div');s.className='spark';s.textContent=emo;el.appendChild(s);setTimeout(()=>s.remove(),900);}

function measureCenters(){
  const scene=$('planet'), grid=$('planetGrid');
  const sr=scene.getBoundingClientRect();
  CLASSES[currentClass].students.forEach((s,i)=>{
    const el=grid.querySelector(`.partner[data-i="${i}"]`);
    if(!el)return; const r=el.getBoundingClientRect();
    s._cx=r.left+r.width/2-sr.left; s._cy=r.top+r.height/2-sr.top;
  });
}
function renderVines(){
  const scene=$('planet'), svg=$('vines');
  const sr=scene.getBoundingClientRect();
  svg.setAttribute('width',sr.width); svg.setAttribute('height',sr.height);
  svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);
  const S=CLASSES[currentClass].students; let paths='';
  for(let i=0;i<S.length;i++){
    for(const j of S[i].vines){
      if(j<=i)continue; const a=S[i],b=S[j];
      if(a._cx==null||b._cx==null)continue;
      const mx=(a._cx+b._cx)/2, my=(a._cy+b._cy)/2-26;
      paths+=`<path d="M${a._cx} ${a._cy} Q ${mx} ${my} ${b._cx} ${b._cy}" fill="none" stroke="#9BD9A8" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/>`;
      paths+=`<circle cx="${mx}" cy="${my}" r="7" fill="#A8E6CF" stroke="#fff" stroke-width="2"/>`;
      paths+=`<path d="M${mx} ${my} q-8 -4 -10 -12 q9 1 12 11z" fill="#8fd18f"/>`;
    }
  }
  svg.innerHTML=paths;
}

function switchClass(id){

}

let growthCardId=null;
function openGrowthCard(i){
  growthCardId=i;
  const cls=CLASSES[currentClass]; const s=cls.students[i];
  const lvl = s.score>=20?3 : s.score>=14?2 : s.score>=8?1 : 0;
  const NODES=['蛋','幼体','成体','进化'];
  const tl=NODES.map((nm,k)=>{
    const done=k<=lvl, cur=k===lvl;
    const line = k<NODES.length-1 ? `<div class="tline ${k<lvl?'done':''}"></div>`:'';
    return `<div class="tnode ${done?'done':''} ${cur?'cur':''}"><div class="dot">${done?'✓':k+1}</div><div class="tl">${nm}</div></div>${line}`;
  }).join('');

  const DECORS=[['🌱','嫩芽发夹',1],['🔍','放大镜',1],['🎀','蝴蝶结',1],['🧣','小围巾',2],['🎩','探险帽',2],['👓','星星眼镜',2],['👑','小皇冠',3],['🌈','彩虹披风',3]];
  const decorHtml=DECORS.map(([em,nm,req])=>{
    const ok = s.score>= (req===1?6:req===2?12:18);
    return `<div class="ditem ${ok?'':'lock'}"><div class="di">${em}</div><div class="dn">${nm}</div></div>`;
  }).join('');

  const connected=s.vines.map(j=>cls.students[j]).filter(Boolean);
  let netSvg='';
  if(connected.length){
    const R=64, cx=80, cy=80;
    let lines='', dots='';
    connected.forEach((c,k)=>{
      const ang=(-90 + k*360/connected.length)*Math.PI/180;
      const x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
      lines+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#9BD9A8" stroke-width="3"/>`;
      dots+=`<circle cx="${x}" cy="${y}" r="20" fill="${c.color}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#5A5566">${c.n[0]}</text>`;
    });
    netSvg=`<svg class="netsvg" width="160" height="160" viewBox="0 0 160 160">
      ${lines}
      <circle cx="${cx}" cy="${cy}" r="24" fill="${s.color}"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" font-weight="900" fill="#5A5566">${s.n[0]}</text>
      ${dots}</svg>`;
  }else{
    netSvg=`<svg class="netsvg" width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="26" fill="${s.color}"/><text x="80" y="85" text-anchor="middle" font-size="13" font-weight="900" fill="#5A5566">${s.n[0]}</text></svg>`;
  }
  const netNote = connected.length
    ? `已与 <b>${connected.length}</b> 位伙伴连起藤蔓：<br>${connected.map(c=>esc(c.n)).join('、')}<br>合作越多，共生越繁荣 🌿`
    : `还没有连接藤蔓～<br>多用「小组合作 / 帮助同学」点评，<br>就能织出专属关系网 🌿`;

  const stColor={active:'#5AA0C8',wilt:'#B0A89C',loved:'#FF8FB0',injured:'#FF9E9E'}[s.state];
  const stTxt=stateText(s.state);

  $('growthCard').innerHTML=`
    <div class="ghead">
      <div class="gava" style="--c:${s.color}">${creature(s.type,s.color)}</div>
      <div><div class="gn">${esc(s.n)}</div>
        <div class="gm">${cls.name} · ${GROUPS[i%4]} · ${cls.theme}</div>
        <div class="gstate" style="background:${stColor}22;color:${stColor}">${stTxt} · ${s.score} 生态值</div>
      </div>
    </div>
    <div class="sec"><div class="sect">🌟 进化时间轴</div><div class="timeline">${tl}</div></div>
    <div class="sec"><div class="sect">🎀 预置装扮（收集驱动）</div><div class="decor">${decorHtml}</div></div>
    <div class="sec"><div class="sect">🌿 关系藤蔓网</div><div class="netcard">${netSvg}<div class="netnote">${netNote}</div></div></div>
  `;
  $('overlay').classList.add('show');
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}

function saveClass(id){
  try{
    const c=CLASSES[id];
    localStorage.setItem('gp_class_'+id, JSON.stringify({
      students:c.students, eco:c.eco, stagePct:c.stagePct, tidy:c.tidy
    }));
  }catch(e){}
}
function loadClasses(){
  CLASS_ORDER.forEach(id=>{
    try{
      const raw=localStorage.getItem('gp_class_'+id);
      if(raw){
        const d=JSON.parse(raw); const c=CLASSES[id];
        if(Array.isArray(d.students)) c.students=d.students;
        if(typeof d.eco==='number') c.eco=d.eco;
        if(typeof d.stagePct==='number') c.stagePct=d.stagePct;
        if(typeof d.tidy==='number') c.tidy=d.tidy;
      }
    }catch(e){}
  });
}

function spawnPartner(name, idx){
  const cls=CLASSES[currentClass];
  const types=[...new Set(cls.students.map(s=>s.type))];
  const type = types.length? types[idx % types.length] : 'worm';
  const color = PALETTE[idx % PALETTE.length];
  return mk(name, type, color, 'active', 8, 0, []);
}

function openRoster(){ renderRoster(); $('roster').classList.add('show'); }
function closeRoster(){ $('roster').classList.remove('show'); }

function renderRoster(){
  const cls=CLASSES[currentClass];
  $('rosterClass').textContent=`${cls.name} · ${cls.theme}`;
  $('rosterCount').textContent=`${cls.students.length} 位伙伴`;
  $('rosterList').innerHTML = cls.students.map((s,i)=>`
    <div class="ritem" style="--c:${s.color}">
      <div class="ravi">${creature(s.type,s.color)}</div>
      <input value="${escAttr(s.n)}" data-i="${i}" maxlength="12" />
      <button class="rdel" data-i="${i}">🗑 删除</button>
    </div>`).join('');
  $('rosterList').querySelectorAll('input').forEach(inp=>{
    inp.onchange=()=>renameStudent(+inp.dataset.i, inp.value);
    inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); };
  });
  $('rosterList').querySelectorAll('.rdel').forEach(b=>b.onclick=()=>deleteStudent(+b.dataset.i));

function renameStudent(i, name){
  name=name.trim();
  if(!name){ renderRoster(); return; }
  const cls=CLASSES[currentClass];
  if(cls.students[i].n===name) return;
  cls.students[i].n=name;
  commitRoster();
  toast(`已改名为 ${name} ✏️`);
}
function addStudent(name){
  name=name.trim();
  if(!name) return;
  const cls=CLASSES[currentClass];
  if(cls.students.some(s=>s.n===name)){ toast('已存在同名伙伴'); return; }
  cls.students.push(spawnPartner(name, cls.students.length));
  commitRoster();
  toast(`已添加 ${name} 🌱`);
}
function deleteStudent(i){
  const cls=CLASSES[currentClass];
  const name=cls.students[i].n;
  if(!confirm(`确定删除「${name}」吗？\nTA 的伙伴与藤蔓、点评等数据会一起移除。`)) return;
  cls.students.splice(i,1);
  cls.students.forEach(s=>{ s.vines=s.vines.filter(v=>v!==i).map(v=> v>i? v-1 : v); });
  if(selectedId===i){ selectedId=null; }
  else if(selectedId!==null && selectedId>i){ selectedId--; }
  if(growthCardId===i){ closeGrowth(); }
  commitRoster();
  toast(`已删除 ${name} 🗑`);
}
function importBatch(){
  const txt=$('importArea').value||'';
  const names=txt.split(/[\n,，、\s]+/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){ $('importHint').textContent='没有识别到名字～'; return; }
  const cls=CLASSES[currentClass];
  const seen=new Set(cls.students.map(s=>s.n));
  let added=0;
  names.forEach(nm=>{ if(!seen.has(nm)){ cls.students.push(spawnPartner(nm, cls.students.length)); seen.add(nm); added++; } });
  const dup=names.length-added;
  $('importHint').textContent=`已导入 ${added} 位`+(dup?`（跳过 ${dup} 个重复/空）`:'');
  $('importArea').value='';
  commitRoster();
}

function commitRoster(){
  saveClass(currentClass);
  renderTopbar(); renderPlanet(); renderBoard(); updateSelPanel();
  renderRoster();
}

/* =====================================================================
   云同步层（可选）
   开启方式：在本文件 <script> 之前加一行
       <script>window.GP_API_BASE='https://你的域名'<\/script>
   未设置或登录失败 → 自动退回纯本地 localStorage，原型行为完全不变
   ===================================================================== */
const GP_API=(typeof window.GP_API_BASE==='string')?window.GP_API_BASE.replace(/\/+$/,''):null;
if(GP_API==='__GP_API_BASE__') GP_API=null;
const GP_CLOUD=GP_API!==null;
const KIND2TYPE={
  // 萌系自然 1-2
  tuan_tuan:'worm', ya_ya:'sprout', cloud_sheep:'worm', star_kid:'crystal',
  bunny:'worm', duckling:'fish', piggy:'worm', kitty:'worm', puppy:'worm', hug_bear:'worm',
  bub_fish:'fish', slow_turtle:'fish', blue_whale:'fish', little_crab:'fish',
  // 生命观察 3-4
  can_bao:'worm', ke_dou:'fish', seed_sprite:'sprout', ant_worker:'worm', snail:'worm',
  butterfly:'butterfly', shy_plant:'sprout', sun_flower:'sprout', mushroom:'sprout', bamboo:'sprout',
  crystal:'crystal', minnow:'fish',
  // 动漫原创 5-6
  fire_sprite:'crystal', water_sprite:'fish', grass_sprite:'sprout', thunder_sprite:'crystal', star2:'crystal',
  mech_eco:'crystal', light_spirit:'crystal', ice_spirit:'crystal', wind_spirit:'crystal',
  rock_spirit:'crystal', dragon_spirit:'crystal', dark_spirit:'crystal'
};
const PACK2TYPE={cute_nature:'worm',life_obs:'sprout',anime_original:'crystal'};

const GP={
  token:'',
  teacher:null,
  clsMap:{},
  ready:false,
  enabled(){ return GP_CLOUD && !!this.token; },

  async api(path,opt={}){
    const headers={'Content-Type':'application/json'};
    if(this.token) headers.Authorization='Bearer '+this.token;
    const res=await fetch(GP_API+path,{...opt,headers:{...headers,...(opt.headers||{})}});
    if(res.status===401){ this.logout(); throw new Error('登录已失效，请重新登录'); }
    if(res.status===204) return null;
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||('请求失败 '+res.status));
    return data;
  },

  async login(email,password){
    const data=await this.api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});
    this.token=data.token; this.teacher=data.teacher;
    localStorage.setItem('gp_token',data.token);
    await this.pullAll();
  },

  logout(){
    this.token=''; this.teacher=null; this.ready=false;
    localStorage.removeItem('gp_token');
    renderGPBtn();
  },

  async pullAll(){
    const data=await this.api('/api/classes');
    if(!data.classes.length){ toast('账号下还没有班级，请先在后台建班'); return; }
    const order=[], map={};
    for(const rc of data.classes){
      const lid='r'+rc.id.replace(/-/g,'').slice(0,8);
      order.push(lid);
      map[lid]={remoteId:rc.id,ids:[]};
      CLASSES[lid]={id:lid,name:rc.name,theme:rc.theme||'科学班生态',stagePct:0,eco:0,tidy:80,students:[]};
    }
    CLASS_ORDER.length=0; order.forEach(id=>CLASS_ORDER.push(id));
    Object.keys(CLASSES).forEach(k=>{ if(!map[k]) delete CLASSES[k]; });
    this.clsMap=map;
    for(const lid of order) await this.pullState(lid);
    this.ready=true;
    if(!CLASSES[currentClass]) currentClass=order[0];
    renderTopbar(); renderPlanet(); renderBoard(); renderDock(); updateSelPanel();
  },

  async pullState(localId){
    const m=this.clsMap[localId]; if(!m) return;
    const data=await this.api('/api/classes/'+m.remoteId+'/state');
    const c=CLASSES[localId];
    c.name=data.class.name; c.theme=data.class.theme||c.theme;
    c.eco=data.class.eco_value; c.stagePct=data.class.stage.progress; c.tidy=data.board.tidiness;
    const idx={}; data.students.forEach((s,i)=>{ idx[s.id]=i; });
    m.ids=data.students.map(s=>s.id);
    c.students=data.students.map((s,i)=>({
      n:s.nickname||s.name,
      type:KIND2TYPE[s.partner_kind]||PACK2TYPE[data.class.theme_pack]||'worm',
      color:s.color||PALETTE[i%PALETTE.length],
      state:s.hurt?'injured':(s.loved?'loved':(s.status==='droop'?'wilt':'active')),
      score:s.growth, ask:s.ask,
      vines:(data.vines||[]).filter(v=>v.a_id===s.id||v.b_id===s.id)
              .map(v=>idx[v.a_id===s.id?v.b_id:v.a_id]).filter(x=>x!==undefined),
      decor:[]
    }));
  },

  pushEvent(gi,ti){
    const m=this.clsMap[currentClass];
    const tag=TAG_GROUPS[gi].tags[ti];
    if(!this.enabled()||!m||!tag||!tag.key||selectedId===null) return;
    const sid=m.ids[selectedId]; if(!sid) return;
    this.api('/api/events',{method:'POST',
      body:JSON.stringify({class_id:m.remoteId,student_id:sid,label_key:tag.key})})
      .then(()=>setTimeout(async()=>{
        await this.pullState(currentClass);
        renderPlanet(); renderTopbar(); renderBoard(); updateSelPanel();
        if(typeof measureCenters==='function') measureCenters();
        if(typeof renderVines==='function') renderVines();
        document.querySelectorAll('.partner').forEach(e=>e.classList.toggle('sel',+e.dataset.i===selectedId));
      },320))
      .catch(err=>{ toast('☁ 同步失败，已暂存在本机：'+err.message); renderGPBtn(); });
  }
};

function openLogin(){

    box.innerHTML=`<div style="background:#fff;border-radius:20px;padding:26px 28px;width:320px;box-shadow:0 18px 50px rgba(0,0,0,.2)">
      <div style="font-size:17px;font-weight:900;color:#5A5566;margin-bottom:4px">☁ 老师登录</div>
      <div style="font-size:12px;color:#9A94A6;margin-bottom:16px">登录后班级数据跨设备同步；不登录也能用（只存本机）</div>
      <input id="gpEmail" placeholder="邮箱" style="width:100%;padding:10px 12px;border:2px solid #EFE9E1;border-radius:12px;margin-bottom:10px;font-size:14px;outline:none">
      <input id="gpPwd" type="password" placeholder="密码" style="width:100%;padding:10px 12px;border:2px solid #EFE9E1;border-radius:12px;font-size:14px;outline:none">
      <div id="gpErr" style="color:#E4798A;font-size:12px;min-height:18px;margin-top:8px"></div>

        <button id="gpOk" style="flex:1;padding:10px;border-radius:12px;border:0;background:#A8E6CF;color:#3E6B52;font-weight:800;cursor:pointer">登录</button>
      </div></div>`;
    document.body.appendChild(box);
  }
  box.classList.remove('hidden'); box.style.display='flex';
  const emailEl=$('gpEmail'), pwdEl=$('gpPwd'), errEl=$('gpErr');
  errEl.textContent=''; emailEl.value=''; pwdEl.value=''; emailEl.focus();
  $('gpCancel').onclick=()=>{ box.style.display='none'; };

    catch(err){ errEl.textContent=err.message||'登录失败'; }
  };
  $('gpOk').onclick=submit;
  pwdEl.onkeydown=e=>{ if(e.key==='Enter') submit(); };
}

  bind('tReset', onTimerReset);
  bind('clearSel', onClearSel);
  bind('openCard', onOpenCard);
  bind('overlay', onOverlayClick);
  bind('gearBtn', openRoster);
  bind('rosterClose', closeRoster);
  bind('roster', e=>{ if(e.target===$('roster')) closeRoster(); });
  bind('addBtn', ()=>{ const v=$('addInput').value; $('addInput').value=''; addStudent(v); });
  const addInput=$('addInput');
  if(addInput) addInput.onkeydown=e=>{ if(e.key==='Enter'){ const v=e.target.value; e.target.value=''; addStudent(v); } };
  bind('importBtn', importBatch);
}

function init(){
  try{
    loadClasses();
    try{ const t=localStorage.getItem('gp_token'); if(GP_CLOUD&&t){ GP.token=t; } }catch(e){}
    renderGPBtn();
    if(GP_CLOUD&&GP.token){ GP.pullAll().catch(err=>{ toast('☁ 云端连接失败，先用本机数据'); renderGPBtn(); }); }
    try{ const last=localStorage.getItem('gp_lastClass'); if(last&&CLASSES[last]) currentClass=last; }catch(e){}
    renderTopbar(); renderPlanet(); renderBoard(); renderDock();
    bindControls();
  }catch(e){
    console.error('[growth-planet] 初始化失败：', e);
    const t=$('toast'); if(t){ t.textContent='页面初始化出错，请刷新或查看控制台'; t.classList.add('show'); }
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
