# 成长星球·科学班生态 —— Docker Compose（独立 Postgres 实例版）
# 不污染 umami-db / eat-what：新增 gp-db 容器，端口 5434，专用库 growth_planet。
#
# 运行（在仓库根目录执行）：
#   cp deploy/.env.example deploy/.env  &&  vi deploy/.env
#   docker compose -f deploy/growth-planet-docker-compose.yml up -d --build
#
# 首次初始化表结构（gp-db 健康检查通过后）：
#   docker exec -i gp-db psql -U gp_app -d growth_planet < deploy/growth-planet-init.sql
#
# 创建老师账号：
#   docker exec -it gp-api sh -c "set -a; . /dev/null; node scripts/create-teacher.js a@b.com 密码 姓名"
#   （需先 docker cp .env gp-api:/app/.env 或用 docker run --env-file）
#
# 前端静态文件由宿主机 Nginx 托管，反代 /api 到 127.0.0.1:3100（见 nginx/host-gateway.example.conf）。

services:
  gp-db:
    image: postgres:14-alpine
    container_name: gp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: growth_planet
      POSTGRES_USER: gp_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"   # 仅绑本机，区别于 umami-db 的 5433
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gp_app -d growth_planet"]
      interval: 10s
      timeout: 5s
      retries: 5

  gp-api:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: growth-planet-api:latest
    container_name: gp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3100
      NODE_ENV: production
      DB_HOST: gp-db
      DB_PORT: 5432
      DB_NAME: growth_planet
      DB_USER: gp_app
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      gp-db:
        condition: service_healthy

  # 前端静态托管 + /api 反代 + HTTPS 由【宿主机已有的 Nginx】负责
  # （本机 80/443 已被其它站点占用，故不再单独起 gp-web 抢端口）
  # 参见 deploy/nginx/host-gateway.example.conf，复制到宿主 /etc/nginx/conf.d/ 后 reload
