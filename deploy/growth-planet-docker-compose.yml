# 成长星球·科学班生态 —— Docker Compose
# 复用现有 umami-db (Postgres14) 容器；本 compose 只起后端 + Nginx。
# 后端连现有 Postgres：host=umami-db（同 docker 网络）/ 或 127.0.0.1:5433（宿主网络）。
# 若 growth-api 与 umami-db 不在同一 compose 网络，请用宿主 IP+5433 并暴露端口。

services:
  growth-api:
    build: .
    image: growth-planet-api:latest
    container_name: growth-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=umami-db        # 同网络用容器名；跨网络改宿主机内网IP
      - DB_PORT=5432            # 容器间用5432；若走宿主映射端口则用5433
      - DB_NAME=growth_planet
      - DB_USER=gp_app
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3100
    ports:
      - "127.0.0.1:3100:3100"   # 仅绑本地，由 Nginx 反代
    depends_on:
      - umami-db
    networks:
      - gp-net

  growth-nginx:
    image: nginx:alpine
    container_name: growth-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./growth-planet-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro      # 自包含 HTML 放此目录
      - ./certs:/etc/nginx/certs:ro               # SSL 证书
    depends_on:
      - growth-api
    networks:
      - gp-net

# 复用已有 Postgres（不在此定义，假设 umami-db 已运行且在同一 docker 网络 gp-net）
# 若需独立网络桥接，请在 umami-db 启动命令加 --network gp-net 或建 external network。
networks:
  gp-net:
    external: true
    name: gp-net
