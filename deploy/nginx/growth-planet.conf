# growth-planet 前端站点（独立子域名 gp.mealpick.me，规避子路径大坑）
# 启用：ln -s /etc/nginx/sites-available/growth-planet /etc/nginx/sites-enabled/
# 反代 /api/ -> gp-api 容器(127.0.0.1:3100)
# 静态前端 -> /opt/growth-planet-new/deploy/frontend-built
#
# 注意：前端 JS 的 API 请求走根路径 /api/...（见 teacher-dashboard.html 中 GP_API_BASE=''），
# 因此必须独立子域名，不能挂 /gp/ 子路径，否则会与主站后端 /api/ 冲突。
#
# ⚠️ 此文件为 certbot 接管后的【线上实际内容】存档（certbot 会把 listen 443 段插到
#    第一个 server 块末尾，并新增一个 80->443 的 301 跳转 server 块）。
#    回滚/重建时以本文件为准，但证书路径需替换为当时 letsencrypt 实际路径。

# ── HTTPS server（certbot 管理，含 SSL 与 443 监听）──
server {
    server_name gp.mealpick.me;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /opt/growth-planet-new/deploy/frontend-built;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gp.mealpick.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gp.mealpick.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── HTTP server（80 强制 301 跳转到 HTTPS，certbot 管理）──
server {
    if ($host = gp.mealpick.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name gp.mealpick.me;
    return 404; # managed by Certbot
}
