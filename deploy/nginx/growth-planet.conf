# growth-planet 前端站点（独立子域名，规避子路径大坑）
# 启用：ln -s /etc/nginx/sites-available/growth-planet /etc/nginx/sites-enabled/
# 反代 /api/ -> gp-api 容器(127.0.0.1:3100)
# 静态前端 -> /opt/growth-planet-new/deploy/frontend-built
#
# 注意：前端 JS 的 API 请求走根路径 /api/...（见 teacher-dashboard.html 中 GP_API_BASE=''），
# 因此必须独立子域名，不能挂 /gp/ 子路径，否则会与主站后端 /api/ 冲突。

server {
    listen 80;
    server_name gp.mealpick.me;

    # 前端 API：同域 /api/ 反代到 gp-api 容器（纯 API，挂此路径安全）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态资源（带前端的，必须独立子域名，不能挂子路径）
    location / {
        root /opt/growth-planet-new/deploy/frontend-built;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS(server_name gp.mealpick.me; listen 443 ssl) 由以下命令自动生成，无需手写：
#   certbot --nginx -d gp.mealpick.me --non-interactive --agree-tos \
#           --email admin@mealpick.me --redirect
