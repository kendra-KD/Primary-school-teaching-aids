# 成长星球·科学班生态 —— 宿主 Nginx 网关配置示例
#
# 用法：
#   1) 把本文件复制到宿主 Nginx 的 conf.d（或 sites-enabled）：
#        sudo cp host-gateway.example.conf /etc/nginx/conf.d/growth-planet.conf
#   2) 把下面 __DOMAIN__ 改成你的真实域名（若只想先用 IP 测试，可保留 _ ）
#   3) 前端静态目录路径按实际部署位置调整（默认 /opt/growth-planet/deploy/frontend-built）
#   4) 测试并重载： sudo nginx -t && sudo nginx -reload
#
# 说明：
#   - 后端 gp-api 已把 3100 端口发布到宿主 127.0.0.1:3100
#   - 前端构建产物在 deploy/frontend-built（由 deploy/build-frontend.sh 生成）
#   - 反代 /api 必须【保留前缀】（proxy_pass 末尾不要加 /），否则 404

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;   # 例如 science.example.com；先用 IP/默认可写 _

    # Let's Encrypt 申请证书时的校验目录（certbot --webroot 用），先建好目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 临时：HTTP 直接可用（仅内部试用）。正式上线建议下方 443 块 + certbot 证书
    root /opt/growth-planet/deploy/frontend-built;
    index index.html "growth-planet-老师大屏原型.html";

    location /api/ {
        proxy_pass http://127.0.0.1:3100;   # 注意：末尾无 / ，保留 /api 前缀
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

